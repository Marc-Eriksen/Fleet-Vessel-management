    state.modal = { type:'tender-engine', vesselId:b.dataset.id, tenderId:b.dataset.tenderId, data:null };
    renderModal();
  }));
  document.querySelectorAll('[data-action="edit-tender-engine"]').forEach(b=>b.addEventListener('click', ()=>{
    const v = state.vessels.find(x=>x.id===b.dataset.id);
    const t = v ? (v.tenders||[]).find(tt=>tt.id===b.dataset.tenderId) : null;
    const engine = t ? (t.engines||[]).find(en=>en.id===b.dataset.engineId) : null;
    state.modal = { type:'tender-engine', vesselId:b.dataset.id, tenderId:b.dataset.tenderId, data:engine };
    renderModal();
  }));
  document.querySelectorAll('[data-action="delete-tender-engine"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Remove this engine record?')) return;
    const vesselId = b.dataset.id, tenderId = b.dataset.tenderId, engineId = b.dataset.engineId;
    state.modal = { type:'view-tender', vesselId, tenderId };
    await persistArray('vessels', fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const tenders = (v.tenders||[]).map(t=> t.id===tenderId ? { ...t, engines:(t.engines||[]).filter(en=>en.id!==engineId) } : t);
      return { ...v, tenders };
    }));
    render();
  }));
  document.querySelectorAll('[data-action="add-tender-task"]').forEach(b=>b.addEventListener('click', ()=>{
    state.modal = { type:'tender-task', vesselId:b.dataset.id, tenderId:b.dataset.tenderId, data:null };
    renderModal();
  }));
  document.querySelectorAll('[data-action="edit-tender-task"]').forEach(b=>b.addEventListener('click', ()=>{
    const v = state.vessels.find(x=>x.id===b.dataset.id);
    const t = v ? (v.tenders||[]).find(tt=>tt.id===b.dataset.tenderId) : null;
    const task = t ? (t.maintenance||[]).find(m=>m.id===b.dataset.taskId) : null;
    state.modal = { type:'tender-task', vesselId:b.dataset.id, tenderId:b.dataset.tenderId, data:task };
    renderModal();
  }));
  document.querySelectorAll('[data-action="complete-tender-task"]').forEach(b=>b.addEventListener('click', async ()=>{
    const vesselId = b.dataset.id, tenderId = b.dataset.tenderId, taskId = b.dataset.taskId;
    state.modal = { type:'view-tender', vesselId, tenderId };
    await persistArray('vessels', fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const tenders = (v.tenders||[]).map(t=>{
        if(t.id!==tenderId) return t;
        const tasks = (t.maintenance||[]).map(m=> m.id===taskId ? { ...m, status:'completed', completedDate:new Date().toISOString().slice(0,10) } : m);
        return { ...t, maintenance: tasks };
      });
      return { ...v, tenders };
    }));
    render();
  }));
  document.querySelectorAll('[data-action="delete-tender-task"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Delete this maintenance task?')) return;
    const vesselId = b.dataset.id, tenderId = b.dataset.tenderId, taskId = b.dataset.taskId;
    state.modal = { type:'view-tender', vesselId, tenderId };
    await persistArray('vessels', fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const tenders = (v.tenders||[]).map(t=> t.id===tenderId ? { ...t, maintenance:(t.maintenance||[]).filter(m=>m.id!==taskId) } : t);
      return { ...v, tenders };
    }));
    render();
  }));
  document.querySelectorAll('[data-action="add-tender-doc"]').forEach(b=>b.addEventListener('click', ()=>{
    state.modal = { type:'tender-doc', vesselId:b.dataset.id, tenderId:b.dataset.tenderId };
    renderModal();
  }));
  document.querySelectorAll('[data-action="delete-tender-doc"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Remove this document? This cannot be undone.')) return;
    const vesselId = b.dataset.id, tenderId = b.dataset.tenderId, docId = b.dataset.docId;
    state.modal = { type:'view-tender', vesselId, tenderId };
    await persistArray('vessels', fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const tenders = (v.tenders||[]).map(t=> t.id===tenderId ? { ...t, documents:(t.documents||[]).filter(d=>d.id!==docId) } : t);
      return { ...v, tenders };
    }));
    render();
  }));
  /* Scoped to .modal because reveal-password also appears in the (already-bound)
     companies/contractors list rows — an unscoped query here would double-bind those. */
  const modalEl = document.querySelector('.modal');
  if(modalEl){
    modalEl.querySelectorAll('[data-action="reveal-password"]').forEach(b=>b.addEventListener('click', ()=>{
      const span = b.previousElementSibling;
      if(span && span.classList.contains('pw-mask')){
        const shown = span.dataset.shown === '1';
        span.textContent = shown ? '••••••••' : (span.dataset.pw || '');
        span.dataset.shown = shown ? '0' : '1';
        b.textContent = shown ? 'Show' : 'Hide';
      }
    }));
  }
  /* Add contractor: typing a name that matches an existing contractor fills in
     their details. Only empty fields are filled, so nothing typed is overwritten. */
  const contractorNameInput = state.modal && state.modal.type==='contractor' && !state.modal.data && form ? form.elements.name : null;
  if(contractorNameInput){
    contractorNameInput.addEventListener('input', ()=>{
      const key = contractorNameInput.value.trim().toLowerCase();
      const match = key && state.contractors.find(c=>(c.name||'').trim().toLowerCase()===key);
      const note = document.getElementById('contractorAutofillNote');
      if(note) note.style.display = match ? '' : 'none';
      contractorNameInput.dataset.matchId = match ? match.id : '';
      if(!match) return;
      CONTRACTOR_DETAIL_FIELDS.forEach(f=>{
        const el = form.elements[f];
        if(el && !el.value && match[f]) el.value = match[f];
      });
    });
  }
  const openExistingBtn = document.getElementById('openExistingContractorBtn');
  if(openExistingBtn && contractorNameInput){
    openExistingBtn.addEventListener('click', ()=>{
      if(!contractorNameInput.dataset.matchId) return;
      state.modal = { type:'view-contractor', id: contractorNameInput.dataset.matchId };
      renderModal();
    });
  }
  document.querySelectorAll('[data-action="edit-contractor"]').forEach(b=>b.addEventListener('click', ()=>{
    state.modal = { type:'contractor', data: state.contractors.find(c=>c.id===b.dataset.id) };
    renderModal();
  }));
  document.querySelectorAll('[data-action="add-contractor-payment"]').forEach(b=>b.addEventListener('click', ()=>{
    state.modal = { type:'contractor-payment', id:b.dataset.id, data:null };
    renderModal();
  }));
  document.querySelectorAll('[data-action="edit-contractor-payment"]').forEach(b=>b.addEventListener('click', ()=>{
    const ct = state.contractors.find(x=>x.id===b.dataset.id);
    const pay = ct ? (ct.payments||[]).find(p=>p.id===b.dataset.payid) : null;
    state.modal = { type:'contractor-payment', id:b.dataset.id, data:pay };
    renderModal();
  }));
  document.querySelectorAll('[data-action="delete-contractor-payment"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Delete this payment record?')) return;
    const contractorId = b.dataset.id, payId = b.dataset.payid;
    state.modal = { type:'view-contractor', id:contractorId };
    await persistArray('contractors', fresh => fresh.map(c=> c.id===contractorId ? { ...c, payments:(c.payments||[]).filter(p=>p.id!==payId) } : c));
    render();
  }));
  document.querySelectorAll('[data-action="send-contractor-statement"]').forEach(b=>b.addEventListener('click', ()=>{
    sendContractorStatement(b.dataset.id, b.dataset.channel);
  }));
  document.querySelectorAll('[data-action="view-payment-photo"]').forEach(b=>b.addEventListener('click', (e)=>{
    e.preventDefault();
    const ct = state.contractors.find(x=>x.id===b.dataset.id);
    const p = ct ? (ct.payments||[]).find(x=>x.id===b.dataset.payid) : null;
    if(!p) return;
    const which = b.dataset.which;
    let url = null;
    if(which==='before') url = p.photoBefore;
    else if(which==='after') url = p.photoAfter;
    else if(which && which.startsWith('expense:')){
      const exp = (p.expenses||[])[Number(which.split(':')[1])];
      url = exp ? exp.photo : null;
    }
    openStoredDocument(url);
  }));
}

async function handleFormSubmit(e){
  e.preventDefault();
  if(e.target.flushPendingExpense) e.target.flushPendingExpense();
  const fd = new FormData(e.target);
  const modal = state.modal;
  let targetKey = null, mutateFn = null, nextModal = null, emailAfterSave = null;

  if(modal.type==='vessel'){
    const data = { name:fd.get('name'), type:fd.get('type'), reg:fd.get('reg'), status:fd.get('status'), engineHours:Number(fd.get('engineHours'))||0, notes:fd.get('notes')||'', photo:fd.get('photo')||'', ownerName:fd.get('ownerName')||'', ownerPhone:fd.get('ownerPhone')||'', ownerEmail:fd.get('ownerEmail')||'' };
    const editId = modal.data ? modal.data.id : null;
    targetKey = 'vessels';
    mutateFn = fresh => editId
      ? fresh.map(v=> v.id===editId ? { ...v, ...data } : v)
      : [...fresh, { id:uid('v'), fixedCosts:[], documents:[], engines:[], ...data }];
  }
  else if(modal.type==='maintenance'){
    const data = { vesselId:fd.get('vesselId'), category:fd.get('category'), title:fd.get('title'), description:fd.get('description')||'', dueDate:fd.get('dueDate'), cost:Number(fd.get('cost'))||0, priority:fd.get('priority'),
      billing: fd.get('billing') || (modal.data ? billingOf(modal.data) : 'none') };
    const editId = modal.data ? modal.data.id : null;
    targetKey = 'maintenance';
    mutateFn = fresh => editId
      ? fresh.map(m=> m.id===editId ? { ...m, ...data } : m)
      : [...fresh, { id:uid('m'), status:'upcoming', ...data }];
  }
  else if(modal.type==='crew'){
    const data = { name:fd.get('name'), role:fd.get('role'), vesselId:fd.get('vesselId'), email:fd.get('email')||'', phone:fd.get('phone')||'' };
    const editId = modal.data ? modal.data.id : null;
    targetKey = 'crew';
    mutateFn = fresh => editId
      ? fresh.map(c=> c.id===editId ? { ...c, ...data } : c)
      : [...fresh, { id:uid('c'), quals:[], documents:[], ...data }];
  }
  else if(modal.type==='qual'){
    const data = { name:fd.get('name'), expiry:fd.get('expiry') };
    const crewId = modal.id;
    const editQualId = modal.data ? modal.data.id : null;
    targetKey = 'crew';
    mutateFn = fresh => fresh.map(c=>{
      if(c.id!==crewId) return c;
      const quals = c.quals || [];
      const newQuals = editQualId
        ? quals.map(q=> q.id===editQualId ? { ...q, ...data } : q)
        : [...quals, { id:uid('q'), ...data }];
      return { ...c, quals: newQuals };
    });
  }
  else if(modal.type==='vessel-cost'){
    const data = { label:fd.get('label'), amount:Number(fd.get('amount'))||0, frequency:fd.get('frequency') };
    const vesselId = modal.id;
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=> v.id===vesselId ? { ...v, fixedCosts:[...(v.fixedCosts||[]), { id:uid('fc'), ...data }] } : v);
    nextModal = { type:'view-vessel', id: vesselId };
  }
  else if(modal.type==='vessel-engine'){
    const data = { label:fd.get('engineLabel')||'', type:fd.get('engineType'), serial:fd.get('engineSerial'), hours:Number(fd.get('engineHrs'))||0 };
    const vesselId = modal.id;
    const editEngineId = modal.data ? modal.data.id : null;
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const engines = v.engines || [];
      const newEngines = editEngineId
        ? engines.map(en=> en.id===editEngineId ? { ...en, ...data } : en)
        : [...engines, { id:uid('en'), ...data }];
      return { ...v, engines: newEngines };
    });
    nextModal = { type:'view-vessel', id: vesselId };
  }
  else if(modal.type==='vessel-doc'){
    const dataUrl = fd.get('docData');
    if(!dataUrl){ alert('Please choose a file first.'); return; }
    const vesselId = modal.id;
    const docData = { id:uid('doc'), name:fd.get('docName'), fileName:fd.get('docFileName')||'', dataUrl, addedDate:new Date().toISOString().slice(0,10) };
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=> v.id===vesselId ? { ...v, documents:[...(v.documents||[]), docData] } : v);
    nextModal = { type:'view-vessel', id: vesselId };
  }
  else if(modal.type==='crew-doc'){
    const dataUrl = fd.get('docData');
    if(!dataUrl){ alert('Please choose a file first.'); return; }
    const crewId = modal.id;
    const docData = { id:uid('doc'), name:fd.get('docName'), fileName:fd.get('docFileName')||'', dataUrl, addedDate:new Date().toISOString().slice(0,10) };
    targetKey = 'crew';
    mutateFn = fresh => fresh.map(c=> c.id===crewId ? { ...c, documents:[...(c.documents||[]), docData] } : c);
  }
  else if(modal.type==='tender'){
    const data = { name:fd.get('tenderName'), type:fd.get('tenderType')||'', reg:fd.get('tenderReg')||'' };
    const vesselId = modal.vesselId;
    const editId = modal.data ? modal.data.id : null;
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const tenders = v.tenders || [];
      const newTenders = editId
        ? tenders.map(t=> t.id===editId ? { ...t, ...data } : t)
        : [...tenders, { id:uid('tn'), engines:[], documents:[], maintenance:[], ...data }];
      return { ...v, tenders: newTenders };
    });
    nextModal = editId ? { type:'view-tender', vesselId, tenderId: editId } : { type:'view-vessel', id: vesselId };
  }
  else if(modal.type==='tender-engine'){
    const data = { label:fd.get('engineLabel')||'', type:fd.get('engineType'), serial:fd.get('engineSerial'), hours:Number(fd.get('engineHrs'))||0 };
    const vesselId = modal.vesselId, tenderId = modal.tenderId;
    const editEngineId = modal.data ? modal.data.id : null;
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const tenders = (v.tenders||[]).map(t=>{
        if(t.id!==tenderId) return t;
        const engines = t.engines || [];
        const newEngines = editEngineId
          ? engines.map(en=> en.id===editEngineId ? { ...en, ...data } : en)
          : [...engines, { id:uid('en'), ...data }];
        return { ...t, engines: newEngines };
      });
      return { ...v, tenders };
    });
    nextModal = { type:'view-tender', vesselId, tenderId };
  }
  else if(modal.type==='tender-task'){
    const data = { title:fd.get('title'), description:fd.get('description')||'', category:fd.get('category'), dueDate:fd.get('dueDate'), priority:fd.get('priority'), cost:Number(fd.get('cost'))||0,
      billing: fd.get('billing') || (modal.data ? billingOf(modal.data) : 'none') };
    const vesselId = modal.vesselId, tenderId = modal.tenderId;
    const editTaskId = modal.data ? modal.data.id : null;
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const tenders = (v.tenders||[]).map(t=>{
        if(t.id!==tenderId) return t;
        const tasks = t.maintenance || [];
        const newTasks = editTaskId
          ? tasks.map(m=> m.id===editTaskId ? { ...m, ...data } : m)
          : [...tasks, { id:uid('tm'), status:'upcoming', ...data }];
        return { ...t, maintenance: newTasks };
      });
      return { ...v, tenders };
    });
    nextModal = { type:'view-tender', vesselId, tenderId };
  }
  else if(modal.type==='tender-doc'){
    const dataUrl = fd.get('docData');
    if(!dataUrl){ alert('Please choose a file first.'); return; }
    const vesselId = modal.vesselId, tenderId = modal.tenderId;
    const docData = { id:uid('doc'), name:fd.get('docName'), fileName:fd.get('docFileName')||'', dataUrl, addedDate:new Date().toISOString().slice(0,10) };
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const tenders = (v.tenders||[]).map(t=> t.id===tenderId ? { ...t, documents:[...(t.documents||[]), docData] } : t);
      return { ...v, tenders };
    });
    nextModal = { type:'view-tender', vesselId, tenderId };
  }
  else if(modal.type==='company'){
    const editId = modal.data ? modal.data.id : null;
    const uname = (fd.get('username')||'').trim();
    if(uname && state.companies.some(c => c.id !== editId && (c.username||'').trim().toLowerCase() === uname.toLowerCase())){
      alert('Another company already uses that username. Please choose a different one.');
      return;
    }
    const data = {
      name:fd.get('name'), contactName:fd.get('contactName')||'', contactEmail:fd.get('contactEmail')||'',
      contactPhone:fd.get('contactPhone')||'', address:fd.get('address')||'', notes:fd.get('notes')||'',
      username:uname, password:fd.get('password')||'', vesselIds:fd.getAll('vesselIds')
    };
    targetKey = 'companies';
    mutateFn = fresh => editId
      ? fresh.map(c=> c.id===editId ? { ...c, ...data } : c)
      : [...fresh, { id:uid('co'), ...data }];
  }
  else if(modal.type==='contractor'){
    const data = {
      name:fd.get('name'), contactName:fd.get('contactName')||'', email:fd.get('email')||'', phone:fd.get('phone')||'',
      bankName:fd.get('bankName')||'', accountHolder:fd.get('accountHolder')||'', accountNumber:fd.get('accountNumber')||'',
      branchCode:fd.get('branchCode')||'', accountType:fd.get('accountType')||'', swift:fd.get('swift')||'', notes:fd.get('notes')||''
    };
    /* One record per contractor: adding a name that already exists updates that
       contractor and opens Manage, where further payments are added. */
    const nameKey = (data.name||'').trim().toLowerCase();
    const existing = !modal.data && nameKey ? state.contractors.find(c=>(c.name||'').trim().toLowerCase()===nameKey) : null;
    const editId = modal.data ? modal.data.id : existing ? existing.id : null;
    targetKey = 'contractors';
    mutateFn = fresh => editId
      ? fresh.map(c=> c.id===editId ? { ...c, ...data } : c)
      : [...fresh, { id:uid('ct'), payments:[], ...data }];
    nextModal = editId ? { type:'view-contractor', id: editId } : null;
  }
  else if(modal.type==='contractor-payment'){
    const includeTravel = fd.get('includeTravel') === '1';
    const fixedAmount = Number(fd.get('fixedAmount'))||0;
    let expenses = [];
    try{ expenses = JSON.parse(fd.get('expensesData') || '[]'); }catch(e){ expenses = []; }
    const expensesTotal = expenses.reduce((s,x)=>s+(Number(x.amount)||0),0);
    let data;
    if(includeTravel){
      /* Blank readings stay blank so a trip can be saved with only the "before"
         reading and completed later; distance counts only once both are in. */
      const odoVal = name => { const v = fd.get(name); return v==='' || v==null ? '' : Number(v)||0; };
      const odometerStart = odoVal('odometerStart');
      const odometerEnd = odoVal('odometerEnd');
      const distanceKm = odometerStart!=='' && odometerEnd!=='' ? Math.max(0, odometerEnd - odometerStart) : 0;
      const ratePerKm = Number(fd.get('ratePerKm'))||0;
      const travelAmount = Math.round(distanceKm * ratePerKm * 100) / 100;
      const amount = Math.round((fixedAmount + travelAmount + expensesTotal) * 100) / 100;
      data = {
        description:fd.get('description'), date:fd.get('date'), status:fd.get('status'),
        includeTravel, fixedAmount, amount,
        odometerStart, odometerEnd, distanceKm, ratePerKm, travelAmount,
        photoBefore:fd.get('photoBefore')||'', photoAfter:fd.get('photoAfter')||'',
        expenses
      };
    } else {
      const amount = Math.round((fixedAmount + expensesTotal) * 100) / 100;
      data = {
        description:fd.get('description'), date:fd.get('date'), status:fd.get('status'),
        includeTravel, fixedAmount, amount,
        odometerStart:null, odometerEnd:null, distanceKm:null, ratePerKm:null, travelAmount:null, photoBefore:'', photoAfter:'',
        expenses
      };
    }
    const contractorId = modal.id;
    const editPayId = modal.data ? modal.data.id : null;
    targetKey = 'contractors';
    mutateFn = fresh => fresh.map(c=>{
      if(c.id!==contractorId) return c;
      const payments = c.payments || [];
      const newPayments = editPayId
        ? payments.map(p=> p.id===editPayId ? { ...p, ...data } : p)
        : [...payments, { id:uid('pay'), ...data }];
      return { ...c, payments: newPayments };
    });
    nextModal = { type:'view-contractor', id: contractorId };
  }

  else if(modal.type==='checklist'){
    const labels = fd.getAll('itemLabel'), types = fd.getAll('itemType'), units = fd.getAll('itemUnit'), pars = fd.getAll('itemPar'), mins = fd.getAll('itemMin'), ids = fd.getAll('itemId');
    const items = labels.map((label, i)=>{
      const type = types[i]==='stock' || types[i]==='heading' ? types[i] : 'task';
      const stock = type==='stock';
      return { id: ids[i] || uid('ci'), label: String(label).trim(), type,
        unit: stock ? String(units[i]||'').trim() : '',
        par: stock && pars[i]!=='' ? Number(pars[i])||0 : '',
        min: stock && mins[i]!=='' ? Number(mins[i])||0 : '' };
    }).filter(it => it.label);
    const allVessels = fd.get('allVessels') === '1';
    const vesselIds = allVessels ? [] : fd.getAll('vesselIds');
    if(!items.some(it=>it.type!=='heading')){ alert('Add at least one task or stock item.'); return; }
    if(!allVessels && vesselIds.length === 0){ alert('Choose at least one vessel, or tick "All vessels".'); return; }
    const data = { name:fd.get('name'), frequency:fd.get('frequency'), description:fd.get('description')||'', emailTo:String(fd.get('emailTo')||'').trim(), allVessels, vesselIds, items };
    const editId = modal.data ? modal.data.id : null;
    targetKey = 'checklists';
    mutateFn = fresh => editId
      ? fresh.map(c=> c.id===editId ? { ...c, ...data } : c)
      : [...fresh, { id:uid('cl'), createdDate:localISODate(new Date()), ...data }];
  }
  else if(modal.type==='checklist-run'){
    const items = checklistRunItems(modal);
    const entries = items.map(it=>{
      const base = { itemId:it.id, label:it.label, type:it.type, unit:it.unit||'', par:it.par==null ? '' : it.par, min:it.min==null ? '' : it.min };
      if(it.type==='heading') return base;
      if(it.type==='stock'){
        const raw = fd.get('qty_' + it.id);
        return { ...base, qty: raw==='' || raw==null ? '' : Number(raw)||0 };
      }
      return { ...base, done: fd.get('done_' + it.id) === '1' };
    });
    const complete = entries.every(en => en.type==='heading' ? true : en.type==='stock' ? en.qty!=='' : en.done);
    const cl = state.allChecklists.find(c=>c.id===modal.checklistId);
    const existing = findChecklistRun(modal.checklistId, modal.vesselId, modal.period);
    const frequency = cl ? cl.frequency : (existing ? existing.frequency : 'daily');
    /* the chosen date decides which day / week / month this submission counts for */
    const date = fd.get('runDate') || localISODate(new Date());
    const period = checklistPeriod(frequency, date);
    if(period !== modal.period && findChecklistRun(modal.checklistId, modal.vesselId, period)
      && !confirm(`There's already a ${freqName(frequency).toLowerCase()} checklist saved for ${checklistPeriodLabel(period)}. Replace it with this one?`)) return;
    const completedBy = String(fd.get('completedBy')||'').trim();
    try{ if(completedBy) localStorage.setItem(CREW_NAME_KEY, completedBy); }catch(e){}
    const data = {
      checklistId:modal.checklistId, checklistName: cl ? cl.name : (existing ? existing.checklistName : ''),
      frequency, vesselId:modal.vesselId, period, date, entries,
      status: complete ? 'completed' : 'in-progress',
      completedBy, notes:fd.get('notes')||'',
      updatedAt:new Date().toISOString(),
      updatedByRole: session ? session.role : ''
    };
    targetKey = 'checklistRuns';
    mutateFn = fresh => {
      const same = r => r.checklistId===data.checklistId && r.vesselId===data.vesselId;
      /* a changed date moves the record to its new period */
      const prev = fresh.find(r=> same(r) && r.period===modal.period);
      const rest = fresh.filter(r=> !(same(r) && (r.period===modal.period || r.period===data.period)));
      return [...rest, { ...(prev||{}), id: prev ? prev.id : uid('cr'), ...data }];
    };
    if(e.submitter && e.submitter.value==='email' && cl && cl.emailTo){
      emailAfterSave = checklistEmail(cl, data);
    }
  }
  else if(modal.type==='checklist-import'){
    const lists = fd.getAll('lists');
    const allVessels = fd.get('allVessels') === '1';
    const vesselIds = allVessels ? [] : fd.getAll('vesselIds');
    if(lists.length === 0){ alert('Choose at least one list to import.'); return; }
    if(!allVessels && vesselIds.length === 0){ alert('Choose at least one vessel, or tick "All vessels".'); return; }
    const emailTo = String(fd.get('emailTo')||'').trim();
    const meta = {
      daily:{ name:'Daily checklist', frequency:'daily', description:"OCEANHUB daily routine. The Williams Turbojet section covers the tender's start-of-day and pre-use checks; Engine Room & Systems includes the Cummins Onan generator's daily checks and mandatory CO detector test." },
      weekly:{ name:'Weekly checklist', frequency:'weekly', description:'General yacht best-practice weekly checks.' },
      monthly:{ name:'Monthly checklist', frequency:'monthly', description:'General yacht best-practice monthly checks.' },
      stock:{ name:'Stock guide', frequency:fd.get('stockFrequency') || 'weekly', description:'Exterior maintenance locker. Count what is on hand; par is what should be there.' }
    };
    const created = lists.map(k=>({ id:uid('cl'), createdDate:localISODate(new Date()), ...meta[k], emailTo, allVessels, vesselIds, items: standardChecklistItems(k) }));
    targetKey = 'checklists';
    mutateFn = fresh => [...fresh, ...created];
  }

  if(targetKey && mutateFn){
    await persistArray(targetKey, mutateFn);
  }
  state.modal = nextModal;
  render();
  if(emailAfterSave) window.location.href = emailAfterSave;
}

/* ============================= GLOBAL ACTIONS ============================= */
function attachContentEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    const action = el.dataset.action;
    if(['close-modal','overlay-close','edit-vessel','delete-vessel','edit-contractor','add-contractor-payment','edit-contractor-payment','delete-contractor-payment','send-contractor-statement','view-payment-photo'].includes(action)) return;
    el.addEventListener('click', async ()=>{
      const id = el.dataset.id;
      switch(action){
        case 'add-vessel': state.modal = { type:'vessel', data:null }; renderModal(); break;
        case 'view-vessel': state.modal = { type:'view-vessel', id }; renderModal(); break;
        case 'add-maintenance': state.modal = { type:'maintenance', data:null }; renderModal(); break;
        case 'edit-maintenance': state.modal = { type:'maintenance', data: state.maintenance.find(m=>m.id===id) }; renderModal(); break;
        case 'delete-maintenance':
          if(confirm('Delete this maintenance task?')){
            await persistArray('maintenance', fresh => fresh.filter(m=>m.id!==id));
            render();
          }
          break;
        case 'complete-task':
          await persistArray('maintenance', fresh => fresh.map(m=> m.id===id ? { ...m, status:'completed', completedDate:new Date().toISOString().slice(0,10) } : m));
          render();
          break;
        case 'edit-tender-task':
          { const v = state.vessels.find(x=>x.id===id); const t = v ? (v.tenders||[]).find(tt=>tt.id===el.dataset.tenderId) : null; const task = t ? (t.maintenance||[]).find(m=>m.id===el.dataset.taskId) : null;
            state.modal = { type:'tender-task', vesselId:id, tenderId:el.dataset.tenderId, data:task }; renderModal(); }
          break;
        case 'complete-tender-task':
          { const vesselId = id, tenderId = el.dataset.tenderId, taskId = el.dataset.taskId;
            await persistArray('vessels', fresh => fresh.map(v=>{
              if(v.id!==vesselId) return v;
              const tenders = (v.tenders||[]).map(t=>{
                if(t.id!==tenderId) return t;
                const tasks = (t.maintenance||[]).map(m=> m.id===taskId ? { ...m, status:'completed', completedDate:new Date().toISOString().slice(0,10) } : m);
                return { ...t, maintenance: tasks };
              });
              return { ...v, tenders };
            }));
            render(); }
          break;
        case 'delete-tender-task':
          if(confirm('Delete this maintenance task?')){
            const vesselId = id, tenderId = el.dataset.tenderId, taskId = el.dataset.taskId;
            await persistArray('vessels', fresh => fresh.map(v=>{
              if(v.id!==vesselId) return v;
              const tenders = (v.tenders||[]).map(t=> t.id===tenderId ? { ...t, maintenance:(t.maintenance||[]).filter(m=>m.id!==taskId) } : t);
              return { ...v, tenders };
            }));
            render();
          }
          break;
        case 'add-crew': state.modal = { type:'crew', data:null }; renderModal(); break;
        case 'edit-crew': state.modal = { type:'crew', data: state.crew.find(c=>c.id===id) }; renderModal(); break;
        case 'delete-crew':
          if(confirm('Remove this crew member?')){
            await persistArray('crew', fresh => fresh.filter(c=>c.id!==id));
            render();
          }
          break;
        case 'add-qual': state.modal = { type:'qual', id, data:null }; renderModal(); break;
        case 'edit-qual':
          { const c = state.crew.find(x=>x.id===id); const q = c ? c.quals.find(qq=>qq.id===el.dataset.qualId) : null; state.modal = { type:'qual', id, data:q }; renderModal(); }
          break;
        case 'delete-qual':
          if(confirm('Remove this qualification?')){
            const qualId = el.dataset.qualId;
            await persistArray('crew', fresh => fresh.map(c=> c.id===id ? { ...c, quals:(c.quals||[]).filter(qq=>qq.id!==qualId) } : c));
            render();
          }
          break;
        case 'add-crew-doc': state.modal = { type:'crew-doc', id }; renderModal(); break;
        case 'delete-crew-doc':
          if(confirm('Remove this document? This cannot be undone.')){
            const docId = el.dataset.docId;
            await persistArray('crew', fresh => fresh.map(c=> c.id===id ? { ...c, documents:(c.documents||[]).filter(d=>d.id!==docId) } : c));
            render();
          }
          break;
        case 'add-company': state.modal = { type:'company', data:null }; renderModal(); break;
        case 'edit-company': state.modal = { type:'company', data: state.companies.find(c=>c.id===id) }; renderModal(); break;
        case 'delete-company':
          if(confirm('Delete this company and its owner login? The vessels and their records are kept.')){
            await persistArray('companies', fresh => fresh.filter(c=>c.id!==id));
            render();
          }
          break;
        case 'add-contractor': state.modal = { type:'contractor', data:null }; renderModal(); break;
        case 'view-contractor': state.modal = { type:'view-contractor', id }; renderModal(); break;
        case 'delete-contractor':
          if(confirm('Delete this contractor and their payment records?')){
            await persistArray('contractors', fresh => fresh.filter(c=>c.id!==id));
            state.modal = null;
            render();
          }
          break;
        case 'reveal-password': {
          const span = el.previousElementSibling;
          if(span && span.classList.contains('pw-mask')){
            const shown = span.dataset.shown === '1';
            span.textContent = shown ? '••••••••' : (span.dataset.pw || '');
            span.dataset.shown = shown ? '0' : '1';
            el.textContent = shown ? 'Show' : 'Hide';
          }
          break;
        }
        case 'open-checklists': state.activeTab = 'checklists'; render(); window.scrollTo(0,0); break;
        case 'back-to-dashboard': state.activeTab = 'dashboard'; render(); break;
        case 'add-checklist': state.modal = { type:'checklist', data:null }; renderModal(); break;
        case 'import-checklists': state.modal = { type:'checklist-import' }; renderModal(); break;
        case 'edit-checklist': state.modal = { type:'checklist', data: state.allChecklists.find(c=>c.id===id) }; renderModal(); break;
        case 'delete-checklist':
          if(confirm('Delete this checklist? Past submissions and stock counts are kept.')){
            await persistArray('checklists', fresh => fresh.filter(c=>c.id!==id));
            render();
          }
          break;
        case 'open-checklist-run':
          state.modal = { type:'checklist-run', checklistId:el.dataset.checklistId, vesselId:el.dataset.vesselId, period:el.dataset.period };
          renderModal();
          break;
        case 'delete-checklist-run':
          if(confirm('Delete this checklist submission?')){
            await persistArray('checklistRuns', fresh => fresh.filter(r=>r.id!==id));
            render();
          }
          break;
        case 'billing-tab':
          state.filters.billing = el.dataset.billing;
          render();
          break;
        case 'view-doc':
          openStoredDocument(findStoredDocUrl(el.dataset));
          break;
        case 'logout':
          if(confirm('Sign out? You will need to sign in again to get back in.')){ await logout(); }
          break;
      }
    });
  });

  const fv = document.getElementById('filterVessel');
  const fc = document.getElementById('filterCategory');
  const fs = document.getElementById('filterStatus');
  if(fv) fv.addEventListener('change', ()=>{ state.filters.vessel=fv.value; render(); });
  if(fc) fc.addEventListener('change', ()=>{ state.filters.category=fc.value; render(); });
  if(fs) fs.addEventListener('change', ()=>{ state.filters.status=fs.value; render(); });
  const fcv = document.getElementById('filterChecklistVessel');
  if(fcv) fcv.addEventListener('change', ()=>{ state.filters.clVessel=fcv.value; render(); });
}

/* ============================= RENDER DISPATCH ============================= */
function render(){
  if(!session){ renderLoginGate(); return; }
  if(session.role === 'owner' && !currentCompany()){
    /* the company/login was removed or reassigned while signed in */
    session = null;
    saveSession();
    renderLoginGate('Your access has changed — please sign in again.');
    return;
  }
  applyScoping();
  renderHeaderMeta();
  renderNav();
  /* Checklists has no nav tab — it's opened from the dashboard button. */
  const allowed = navTabs().map(t=>t.id).concat('checklists');
  if(!allowed.includes(state.activeTab)) state.activeTab = 'dashboard';
  const main = document.getElementById('mainContent');
  switch(state.activeTab){
    case 'dashboard': main.innerHTML = renderDashboard(); break;
    case 'vessels': main.innerHTML = renderVessels(); break;
    case 'maintenance': main.innerHTML = renderMaintenance(); break;
    case 'crew': main.innerHTML = renderCrew(); break;
    case 'companies': main.innerHTML = renderCompanies(); break;
    case 'contractors': main.innerHTML = renderContractors(); break;
    case 'checklists': main.innerHTML = renderChecklists(); break;
  }
  attachContentEvents();
  renderModal();
}

/* ============================= DAY / NIGHT SWITCH ============================= */
function renderThemeToggle(){
  const btn = document.getElementById('themeToggle');
  const dark = document.documentElement.dataset.theme === 'dark';
  /* shows the mode you'll switch to */
  btn.innerHTML = dark
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="tt-label">Day</span>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="tt-label">Night</span>';
  btn.title = btn.ariaLabel = dark ? 'Switch to day mode' : 'Switch to night mode';
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  const dark = document.documentElement.dataset.theme !== 'dark';
  if(dark) document.documentElement.dataset.theme = 'dark';
  else delete document.documentElement.dataset.theme;
  try{ localStorage.setItem('oceanhub_theme', dark ? 'dark' : 'light'); }catch(e){}
  renderThemeToggle();
});
renderThemeToggle();

bootstrap();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker registration failed', err));
  });
}
</script>
