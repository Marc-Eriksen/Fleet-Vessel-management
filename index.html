<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ocean Hub — Fleet Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0B2436;
    --navy:#123A52;
    --navy-light:#1C4E6B;
    --paper:#F1E9D8;
    --paper-2:#EBE0C9;
    --paper-line:#D9CBB0;
    --brass:#B8862E;
    --brass-light:#D9A94A;
    --signal-red:#A3372E;
    --seafoam:#2F6E62;
    --ink:#1C2B2E;
    --ink-soft:#5A6B6E;
    --white-card:#FFFFFF;
    --shadow: 0 2px 8px rgba(11,36,54,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background: #FFFFFF;
    color: var(--ink);
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px 80px;}

  /* ===== Header ===== */
  header.top{
    background: linear-gradient(180deg, var(--navy-deep), var(--navy));
    color:#EFE7D6;
    position:relative;
    overflow:hidden;
    border-bottom:3px solid var(--brass);
  }
  header.top .contour{
    position:absolute; inset:0; opacity:0.14; pointer-events:none;
  }
  header.top .inner{
    position:relative; max-width:1180px; margin:0 auto; padding:28px 24px 22px;
    display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px;
  }
  .brandmark{display:flex; align-items:center; gap:14px;}
  .brandmark svg{flex-shrink:0;}
  .brand-title{
    font-family:'Libre Baskerville',serif;
    font-size:30px; letter-spacing:0.5px; margin:0; color:#F6EFDE;
  }
  .brand-sub{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:2.5px;
    text-transform:uppercase; color: var(--brass-light); margin:2px 0 0;
  }
  .header-meta{
    font-family:'Space Mono',monospace; font-size:12px; color:#B9C7CE; text-align:right;
  }
  .header-meta .clock{color:var(--brass-light); font-weight:700;}

  nav.tabs{
    display:flex; gap:2px; background:var(--navy-deep); padding:0 24px;
    max-width:1180px; margin:0 auto; flex-wrap:wrap;
  }
  nav.tabs button{
    font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600; letter-spacing:0.3px;
    color:#A9BCC5; background:transparent; border:none; padding:13px 18px;
    cursor:pointer; border-bottom:3px solid transparent; display:flex; align-items:center; gap:7px;
  }
  nav.tabs button:hover{color:#F6EFDE;}
  nav.tabs button.active{color:#F6EFDE; border-bottom-color:var(--brass);}
  nav.tabs button svg{width:15px;height:15px;}

  main{padding-top:28px;}
  h2.section-title{
    font-family:'Libre Baskerville',serif; font-size:22px; margin:0 0 4px; color:var(--navy-deep);
  }
  p.section-sub{ margin:0 0 20px; color:var(--ink-soft); font-size:13.5px; }

  /* ===== Cards / KPIs ===== */
  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:28px;}
  .kpi{
    background:var(--white-card); border:1px solid var(--paper-line); border-radius:6px;
    padding:16px 18px; box-shadow:var(--shadow); position:relative;
  }
  .kpi .label{font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--ink-soft); font-weight:600;}
  .kpi .value{font-family:'Space Mono',monospace; font-size:28px; font-weight:700; margin-top:6px; color:var(--navy-deep);}
  .kpi.alert .value{color:var(--signal-red);}
  .kpi.warn .value{color:var(--brass);}
  .kpi.good .value{color:var(--seafoam);}

  .card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px;}
  .card{
    background:var(--white-card); border:1px solid var(--paper-line); border-radius:6px;
    box-shadow:var(--shadow); padding:16px 18px; cursor:pointer; transition:transform .12s;
  }
  .card:hover{transform:translateY(-2px);}
  .card .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card h3{font-family:'Libre Baskerville',serif; font-size:17px; margin:0 0 2px; color:var(--navy-deep);}
  .card .meta-line{font-size:12px; color:var(--ink-soft); font-family:'Space Mono',monospace;}
  .card .card-stats{display:flex; gap:18px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--paper-line);}
  .card .stat{font-size:11px; color:var(--ink-soft);}
  .card .stat b{display:block; font-family:'Space Mono',monospace; font-size:15px; color:var(--navy); font-weight:700;}

  /* ===== Status stamps ===== */
  .stamp{
    display:inline-block; font-family:'Space Mono',monospace; font-size:10px; font-weight:700;
    letter-spacing:1.2px; text-transform:uppercase; padding:3px 9px; border-radius:3px;
    border:1.5px solid currentColor; transform:rotate(-2deg); white-space:nowrap;
  }
  .stamp.overdue{color:var(--signal-red); background:rgba(163,55,46,0.07);}
  .stamp.due-soon{color:var(--brass); background:rgba(184,134,46,0.08);}
  .stamp.upcoming{color:var(--navy); background:rgba(18,58,82,0.06);}
  .stamp.completed{color:var(--seafoam); background:rgba(47,110,98,0.08); transform:rotate(0);}
  .stamp.active{color:var(--seafoam); background:rgba(47,110,98,0.08);}
  .stamp.docked{color:var(--navy); background:rgba(18,58,82,0.06);}
  .stamp.in-maintenance{color:var(--brass); background:rgba(184,134,46,0.08);}
  .stamp.valid{color:var(--seafoam);}
  .stamp.advisory{color:var(--brass);}
  .stamp.red-alert{color:#fff; background:var(--signal-red); border-color:var(--signal-red);}
  .stamp.expired{color:var(--signal-red);}

  /* ===== Table ===== */
  .table-wrap{background:var(--white-card); border:1px solid var(--paper-line); border-radius:6px; box-shadow:var(--shadow); overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft);
    padding:12px 14px; border-bottom:1.5px solid var(--paper-line); font-weight:700; white-space:nowrap;
  }
  tbody td{padding:11px 14px; border-bottom:1px solid var(--paper-line); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(184,134,46,0.05);}
  td.num, th.num{font-family:'Space Mono',monospace;}

  /* ===== Buttons ===== */
  .btn{
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600; padding:8px 15px; border-radius:5px;
    border:1.5px solid var(--navy); background:transparent; color:var(--navy); cursor:pointer;
  }
  .btn:hover{background:var(--navy); color:#F6EFDE;}
  .btn.primary{background:var(--brass); border-color:var(--brass); color:#2A1E08;}
  .btn.primary:hover{background:var(--brass-light); border-color:var(--brass-light);}
  .btn.danger{border-color:var(--signal-red); color:var(--signal-red);}
  .btn.danger:hover{background:var(--signal-red); color:#fff;}
  .btn.small{padding:5px 10px; font-size:12px;}
  .btn.ghost{border-color:var(--paper-line); color:var(--ink-soft);}
  .btn.ghost:hover{background:var(--paper-2); color:var(--ink);}
  .toolbar{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px;}
  .filters{display:flex; gap:8px; flex-wrap:wrap;}
  select, input, textarea{
    font-family:'Inter',sans-serif; font-size:13px; padding:8px 10px; border:1.5px solid var(--paper-line);
    border-radius:5px; background:#fff; color:var(--ink);
  }
  select:focus, input:focus, textarea:focus{outline:2px solid var(--brass-light); border-color:var(--brass);}
  label.field{display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:12px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  /* ===== Timeline (dashboard) ===== */
  .timeline{background:var(--white-card); border:1px solid var(--paper-line); border-radius:6px; box-shadow:var(--shadow); padding:6px 0;}
  .tl-item{display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--paper-line);}
  .tl-item:last-child{border-bottom:none;}
  .tl-date{font-family:'Space Mono',monospace; font-size:12px; color:var(--navy); width:82px; flex-shrink:0;}
  .tl-body{flex:1; min-width:0;}
  .tl-title{font-size:13.5px; font-weight:600; color:var(--ink);}
  .tl-sub{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
  .empty-note{padding:24px; text-align:center; color:var(--ink-soft); font-size:13px;}

  /* ===== Crew ===== */
  .qual-chip{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; padding:5px 10px; border-radius:14px;
    border:1px solid var(--paper-line); background:var(--paper-2); margin:3px 5px 3px 0;
  }
  .qual-dot{width:7px;height:7px;border-radius:50%; flex-shrink:0;}
  .qual-dot.valid{background:var(--seafoam);}
  .qual-dot.advisory{background:var(--brass);}
  .qual-dot.red-alert{background:var(--signal-red);}
  .qual-dot.expired{background:var(--signal-red);}

  /* ===== Modal ===== */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(11,36,54,0.55); display:flex; align-items:flex-start;
    justify-content:center; padding:40px 16px; overflow-y:auto; z-index:100;
  }
  .modal{
    background:var(--white-card); border-radius:8px; max-width:560px; width:100%;
    padding:26px 28px 24px; box-shadow:0 12px 40px rgba(0,0,0,0.3);
  }
  .modal h3{font-family:'Libre Baskerville',serif; margin:0 0 18px; color:var(--navy-deep); font-size:19px;}
  .modal .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px; padding-top:16px; border-top:1px dashed var(--paper-line);}
  .modal .close-x{position:absolute;}
  .modal-header-row{display:flex; justify-content:space-between; align-items:center;}

  .detail-section{margin-top:16px;}
  .detail-section h4{font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft); margin:0 0 8px; border-bottom:1px solid var(--paper-line); padding-bottom:6px;}
  .mini-row{display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:13px;}

  .cost-total-bar{
    background:var(--navy-deep); color:#F6EFDE; border-radius:6px; padding:16px 20px; margin-bottom:20px;
    display:flex; gap:32px; flex-wrap:wrap; align-items:center;
  }
  .cost-total-bar .ctb-item .label{font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--brass-light);}
  .cost-total-bar .ctb-item .value{font-family:'Space Mono',monospace; font-size:22px; font-weight:700;}

  /* ===== Login gate ===== */
  .login-wrap{max-width:370px; margin:46px auto 0;}
  .login-roles{display:flex; gap:8px; margin:14px 0 18px;}
  .login-role{
    flex:1; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; padding:11px 8px;
    border-radius:5px; border:1.5px solid var(--paper-line); background:#fff; color:var(--ink-soft); cursor:pointer;
  }
  .login-role:hover{color:var(--ink);}
  .login-role.active{border-color:var(--brass); background:var(--brass); color:#2A1E08;}
  .login-error{color:var(--signal-red); font-size:13px; min-height:18px; margin:2px 0 8px;}

  /* ===== Companies / vessel assignment ===== */
  .vessel-check-grid{display:flex; flex-direction:column; gap:7px; margin-bottom:8px;}
  .vessel-check{display:flex; align-items:center; gap:9px; font-size:13px; font-weight:500; color:var(--ink);}
  .vessel-check input{width:auto;}
  .pw-mask{font-family:'Space Mono',monospace; letter-spacing:1px;}

  /* ===== Sub-tabs (billing filter) ===== */
  .subtabs{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 16px;}
  .subtab{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; padding:7px 13px;
    border-radius:5px; border:1.5px solid var(--paper-line); background:#fff; color:var(--ink-soft); cursor:pointer;
  }
  .subtab:hover{color:var(--ink);}
  .subtab.active{border-color:var(--navy); background:var(--navy); color:#F6EFDE;}
  .subtab .cnt{opacity:0.7; font-weight:700; margin-left:5px;}
  .stamp.bill-quoted{color:var(--navy); background:rgba(18,58,82,0.06);}
  .stamp.bill-invoiced{color:var(--brass); background:rgba(184,134,46,0.09);}
  .stamp.bill-paid{color:var(--seafoam); background:rgba(47,110,98,0.09);}
  .stamp.pay-outstanding{color:var(--signal-red); background:rgba(163,55,46,0.07);}
  .stamp.pay-paid{color:var(--seafoam); background:rgba(47,110,98,0.09);}

  @media (max-width:640px){
    .wrap{padding:0 14px 60px;}
    header.top .inner{padding:20px 14px 16px; flex-direction:column; align-items:flex-start;}
    .header-meta{text-align:left;}
    .brand-title{font-size:24px;}

    nav.tabs{padding:0 8px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
    nav.tabs::-webkit-scrollbar{display:none;}
    nav.tabs button{padding:12px 13px; font-size:12.5px; white-space:nowrap; flex-shrink:0;}

    .toolbar{flex-direction:column; align-items:stretch;}
    .toolbar > button{width:100%;}
    .filters{width:100%;}
    .filters select{flex:1 1 auto; min-width:0;}

    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .kpi .value{font-size:22px;}
    .card-grid{grid-template-columns:1fr;}
    .card-stats{flex-wrap:wrap; row-gap:10px;}

    .field-row{grid-template-columns:1fr;}
    input, select, textarea{font-size:16px;}
    .btn{min-height:40px;}

    .modal-overlay{padding:20px 10px;}
    .modal{padding:20px 18px 18px; border-radius:6px;}

    .cost-total-bar{gap:18px; padding:14px 16px;}
    .cost-total-bar .ctb-item .value{font-size:19px;}

    table{font-size:12.5px;}
    thead th, tbody td{padding:9px 10px;}
    .table-wrap{-webkit-overflow-scrolling:touch;}

    .tl-item{padding:11px 14px; gap:10px;}
    .tl-date{width:66px; font-size:11px;}
  }
</style>
</head>

function asArray(v){
  if(!v) return [];
  if(Array.isArray(v)) return v;
  return Object.keys(v).map(k=>v[k]).filter(x=>x!=null);
}

function normalizeKey(key, raw){
  if(key==='vessels') return asArray(raw).map(v=>({ ...v, fixedCosts: asArray(v.fixedCosts), documents: asArray(v.documents), engines: asArray(v.engines),
    tenders: asArray(v.tenders).map(t=>({ ...t, engines: asArray(t.engines), documents: asArray(t.documents), maintenance: asArray(t.maintenance) })) }));
  if(key==='crew') return asArray(raw).map(c=>({ ...c, quals: asArray(c.quals), documents: asArray(c.documents) }));
  if(key==='companies') return asArray(raw).map(c=>({ ...c, vesselIds: asArray(c.vesselIds) }));
  if(key==='contractors') return asArray(raw).map(c=>({ ...c, payments: asArray(c.payments) }));
  return asArray(raw);
}

function applyRemoteData(val){
  state.allVessels = normalizeKey('vessels', val.vessels);
  state.allMaintenance = normalizeKey('maintenance', val.maintenance);
  state.allCrew = normalizeKey('crew', val.crew);
  state.companies = normalizeKey('companies', val.companies);
  state.contractors = normalizeKey('contractors', val.contractors);
  applyScoping();
}

function loadState(){
  return new Promise((resolve, reject)=>{
    try{
      dbRef = firebase.database().ref('oceanhub/data');
      dbListener = (snap)=>{
        const val = snap.val();
        if(val){
          applyRemoteData(val);
        } else if(!firstLoadDone){
          seedData();
          persistAll();
        }
        if(!firstLoadDone){
          firstLoadDone = true;
          if(session) render();
          else if(!document.getElementById('loginForm')) renderLoginGate();
          resolve();
        } else if(session && !state.modal){
          /* live update from another device/user — only refresh if nobody's mid-edit in a form */
          render();
        }
      };
      dbRef.on('value', dbListener, (err)=>{
        if(!firstLoadDone){
          firstLoadDone = true;
          reject(err);
        }
      });
    }catch(e){
      reject(e);
    }
  });
}

/* Initial seed only — writes the whole dataset once when the database is empty. */
async function persistAll(){
  if(!fbInitialized) return;
  try{
    await firebase.database().ref('oceanhub/data').set({
      vessels: state.allVessels, maintenance: state.allMaintenance, crew: state.allCrew, companies: state.companies, contractors: state.contractors
    });
  } catch(e){ /* best effort */ }
}

/* Every ordinary save goes through here: re-fetch the current server copy of just this
   collection right before writing, apply the mutation to that fresh copy, and write only
   this collection back. This means a save can never clobber other people's concurrent
   changes to this or any other record — including sibling fields (like a crew member's
   documents) that this particular edit never touched. */
async function persistArray(key, mutateFn){
  if(!fbInitialized) return null;
  try{
    const snap = await firebase.database().ref('oceanhub/data/' + key).once('value');
    let fresh = normalizeKey(key, snap.val());
    fresh = mutateFn(fresh);
    await firebase.database().ref('oceanhub/data/' + key).set(fresh);
    const allKey = (key === 'companies' || key === 'contractors') ? key
      : 'all' + key.charAt(0).toUpperCase() + key.slice(1);
    state[allKey] = fresh;
    applyScoping();
    return fresh;
  }catch(e){
    return null;
  }
}

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w >= h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Could not read image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}
function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}
/* Browsers block navigating a tab straight to a data: URL, so stored documents
   (base64 data URLs) can't be opened with a plain <a href>. Convert to a Blob
   URL and open that instead — works for both images and PDFs. */
function dataUrlToBlob(dataUrl){
  const comma = dataUrl.indexOf(',');
  const header = dataUrl.slice(0, comma);
  const body = dataUrl.slice(comma + 1);
  const mime = (header.match(/data:([^;]+)/) || [null, 'application/octet-stream'])[1];
  const isBase64 = /;base64/i.test(header);
  const raw = isBase64 ? atob(body) : decodeURIComponent(body);
  const bytes = new Uint8Array(raw.length);
  for(let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}
function findStoredDocUrl(ds){
  const pick = list => ((list || []).find(d => d.id === ds.docId) || {}).dataUrl;
  if(ds.scope === 'crew'){
    const c = state.crew.find(x => x.id === ds.id) || (state.allCrew || []).find(x => x.id === ds.id);
    return pick(c && c.documents);
  }
  const v = state.vessels.find(x => x.id === ds.id) || (state.allVessels || []).find(x => x.id === ds.id);
  if(ds.scope === 'tender'){
    const t = v && (v.tenders || []).find(x => x.id === ds.tenderId);
    return pick(t && t.documents);
  }
  return pick(v && v.documents);
}
function openStoredDocument(dataUrl){
  if(!dataUrl){ alert('That document has no file attached.'); return; }
  try{
    if(dataUrl.slice(0, 5) === 'data:'){
      const url = URL.createObjectURL(dataUrlToBlob(dataUrl));
      /* no 'noopener' here: with it window.open always returns null and we
         couldn't tell a real pop-up block from success */
      const win = window.open(url, '_blank');
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      if(!win) alert('Your browser blocked the document window — allow pop-ups for this site and try again.');
    } else {
      window.open(dataUrl, '_blank', 'noopener');
    }
  }catch(e){
    alert("Couldn't open that document.");
  }
}

async function processDocumentFile(file){
  const MAX_RAW_BYTES = 4 * 1024 * 1024; /* 4MB */
  if(file.size > MAX_RAW_BYTES){
    throw new Error('That file is larger than 4MB — use a smaller photo or a compressed PDF.');
  }
  if(file.type === 'application/pdf'){
    return await readFileAsDataURL(file);
  }
  if(file.type.startsWith('image/')){
    return await resizeImageFile(file, 1400, 0.72);
  }
  throw new Error('Please choose an image or PDF file.');
}
function maintStatus(m){
  if(m.status==='completed') return 'completed';

  return 'upcoming';

  const dd = daysUntil(expiry);

  if(dd <= 7) return 'red-alert';
  if(dd <= 30) return 'advisory';
  return 'valid';
}

  const dueSoon = allTasks.filter(m=>maintStatus(m)==='due-soon').length;
  const qualsExpired = state.crew.flatMap(c=>c.quals).filter(q=>qualStatus(q.expiry)==='expired').length;
  const qualsRedAlert = state.crew.flatMap(c=>c.quals).filter(q=>qualStatus(q.expiry)==='red-alert').length;
  const qualsAdvisory = state.crew.flatMap(c=>c.quals).filter(q=>qualStatus(q.expiry)==='advisory').length;

  const events = [];
  allTasks.filter(m=>m.status!=='completed').forEach(m=>{
    const vesselLabel = m._source==='tender' ? `${vesselName(m.vesselId)} — ${m._tenderName} (tender)` : vesselName(m.vesselId);
    events.push({ date:m.dueDate, kind:'Maintenance', title:m.title, sub:`${vesselLabel} · ${m.category==='scheduled'?'Scheduled':m.category==='daily'?'Daily':'Unscheduled'} · ${fmtCurrency(m.cost)}`, status:maintStatus(m) });
  });
  state.crew.forEach(c=>c.quals.forEach(q=>{
    events.push({ date:q.expiry, kind:'Qualification', title:q.name, sub:`${c.name} (${c.role})`, status:qualStatus(q.expiry) });
  }));
  events.sort((a,b)=> new Date(a.date) - new Date(b.date));
  const upcoming = events.slice(0,10);

  return `
    <div class="toolbar" style="margin-bottom:4px;">
      <div>
        <h2 class="section-title">Fleet dashboard</h2>
        <p class="section-sub" style="margin-bottom:0;">Overview across the register — maintenance and crew certification.</p>
      </div>
      <button class="btn ghost" data-action="logout">Sign out</button>
    </div>
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Vessels on register</div><div class="value">${state.vessels.length}</div></div>
      <div class="kpi ${overdue>0?'alert':''}"><div class="label">Overdue maintenance</div><div class="value">${overdue}</div></div>
      <div class="kpi ${dueSoon>0?'warn':''}"><div class="label">Due within 14 days</div><div class="value">${dueSoon}</div></div>
      <div class="kpi ${qualsExpired>0?'alert':''}"><div class="label">Quals expired</div><div class="value">${qualsExpired}</div></div>
      <div class="kpi ${qualsRedAlert>0?'alert':''}"><div class="label">Quals red alert (≤7 days)</div><div class="value">${qualsRedAlert}</div></div>
      <div class="kpi ${qualsAdvisory>0?'warn':''}"><div class="label">Quals advisory (≤30 days)</div><div class="value">${qualsAdvisory}</div></div>
    </div>
    <h2 class="section-title" style="font-size:18px;">Upcoming events</h2>
    <p class="section-sub">Merged view of maintenance due dates and certificate expiries.</p>
    <div class="timeline">
      ${upcoming.length===0 ? '<div class="empty-note">Nothing on the horizon.</div>' : upcoming.map(e=>`
        <div class="tl-item">
          <div class="tl-date">${fmtDate(e.date)}</div>
          <div class="tl-body">
            <div class="tl-title">${esc(e.title)}</div>
            <div class="tl-sub">${e.kind} · ${esc(e.sub)}</div>
          </div>
          <span class="stamp ${e.status}">${stampLabel(e.status)}</span>
        </div>
      `).join('')}
    </div>
  `;
}

/* ============================= MAINTENANCE ============================= */
function renderMaintenance(){
  return `
    <h2 class="section-title">Maintenance planning</h2>
    <p class="section-sub">Scheduled upkeep and unscheduled repairs across the fleet.</p>
    ${renderMaintenanceTasks()}
  `;
}

function renderMaintenanceTasks(){
  const f = state.filters;
  const admin = isAdmin();
  const allTasks = getAllMaintenanceTasks();
  let rows = allTasks.slice();
  if(f.vessel!=='all') rows = rows.filter(m=>m.vesselId===f.vessel);
  if(f.category!=='all') rows = rows.filter(m=>m.category===f.category);
  if(f.status!=='all') rows = rows.filter(m=>maintStatus(m)===f.status);

  /* billing sub-tabs (admin only) — counts reflect the other active filters */
  const billing = admin ? (f.billing || 'all') : 'all';
  const rowsBeforeBilling = rows.slice();
  const billingCount = id => rowsBeforeBilling.filter(m => billingOf(m) === id).length;
  if(billing !== 'all') rows = rows.filter(m => billingOf(m) === billing);

  rows.sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));

  const totalCost = allTasks.reduce((s,m)=>s+Number(m.cost||0),0);
  const openCost = allTasks.filter(m=>m.status!=='completed').reduce((s,m)=>s+Number(m.cost||0),0);
  const invoicedUnpaid = allTasks.filter(m=>billingOf(m)==='invoiced').reduce((s,m)=>s+Number(m.cost||0),0);

  const billingTabs = admin ? `
    <div class="subtabs">
      <button type="button" class="subtab ${billing==='all'?'active':''}" data-action="billing-tab" data-billing="all">All${''}</button>
      ${BILLING_STAGES.map(b=>`<button type="button" class="subtab ${billing===b.id?'active':''}" data-action="billing-tab" data-billing="${b.id}">${b.label}<span class="cnt">${billingCount(b.id)}</span></button>`).join('')}
      <button type="button" class="subtab ${billing==='none'?'active':''}" data-action="billing-tab" data-billing="none">Not billed<span class="cnt">${billingCount('none')}</span></button>
    </div>` : '';
  const colspan = admin ? 9 : 8;

  return `
    <div class="cost-total-bar">
      <div class="ctb-item"><div class="label">Open work cost</div><div class="value">${fmtCurrency(openCost)}</div></div>
      <div class="ctb-item"><div class="label">All-time recorded cost</div><div class="value">${fmtCurrency(totalCost)}</div></div>
      ${admin ? `<div class="ctb-item"><div class="label">Invoiced, unpaid</div><div class="value">${fmtCurrency(invoicedUnpaid)}</div></div>` : ''}
    </div>
    ${billingTabs}
    <div class="toolbar">
      <div class="filters">
        <select id="filterVessel">
          <option value="all">All vessels</option>
          ${state.vessels.map(v=>`<option value="${v.id}" ${f.vessel===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}
        </select>
        <select id="filterCategory">
          <option value="all" ${f.category==='all'?'selected':''}>All types</option>
          <option value="scheduled" ${f.category==='scheduled'?'selected':''}>Scheduled</option>
          <option value="unscheduled" ${f.category==='unscheduled'?'selected':''}>Unscheduled</option>
          <option value="daily" ${f.category==='daily'?'selected':''}>Daily</option>
        </select>
        <select id="filterStatus">
          <option value="all" ${f.status==='all'?'selected':''}>All statuses</option>
          <option value="overdue" ${f.status==='overdue'?'selected':''}>Overdue</option>
          <option value="due-soon" ${f.status==='due-soon'?'selected':''}>Due soon</option>
          <option value="upcoming" ${f.status==='upcoming'?'selected':''}>Upcoming</option>
          <option value="completed" ${f.status==='completed'?'selected':''}>Completed</option>
        </select>
      </div>
      <button class="btn primary" data-action="add-maintenance">+ Add task</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Task</th><th>Vessel</th><th>Type</th><th>Due</th><th>Priority</th><th class="num">Cost</th><th>Status</th>${admin?'<th>Billing</th>':''}<th></th>
        </tr></thead>
        <tbody>
          ${rows.length===0 ? `<tr><td colspan="${colspan}"><div class="empty-note">No tasks match these filters.</div></td></tr>` : rows.map(m=>{
            const isTender = m._source==='tender';
            const vesselLabel = isTender ? `${esc(vesselName(m.vesselId))} <span style="color:var(--ink-soft); font-size:11px;">— ${esc(m._tenderName)} (tender)</span>` : esc(vesselName(m.vesselId));
            const completeAttrs = isTender ? `data-action="complete-tender-task" data-id="${m.vesselId}" data-tender-id="${m._tenderId}" data-task-id="${m.id}"` : `data-action="complete-task" data-id="${m.id}"`;
            const editAttrs = isTender ? `data-action="edit-tender-task" data-id="${m.vesselId}" data-tender-id="${m._tenderId}" data-task-id="${m.id}"` : `data-action="edit-maintenance" data-id="${m.id}"`;
            const deleteAttrs = isTender ? `data-action="delete-tender-task" data-id="${m.vesselId}" data-tender-id="${m._tenderId}" data-task-id="${m.id}"` : `data-action="delete-maintenance" data-id="${m.id}"`;
            return `
            <tr>
              <td><b>${esc(m.title)}</b>${m.description?`<div style="color:var(--ink-soft); font-size:11.5px; margin-top:2px;">${esc(m.description)}</div>`:''}</td>
              <td>${vesselLabel}</td>
              <td style="text-transform:capitalize;">${m.category}</td>
              <td>${fmtDate(m.dueDate)}</td>
              <td style="text-transform:capitalize;">${m.priority}</td>
              <td class="num">${fmtCurrency(m.cost)}</td>
              <td><span class="stamp ${maintStatus(m)}">${stampLabel(maintStatus(m))}</span></td>
              ${admin ? `<td>${billingOf(m)==='none' ? '<span style="color:var(--ink-soft);">—</span>' : `<span class="stamp bill-${billingOf(m)}">${billingLabel(billingOf(m))}</span>`}</td>` : ''}
              <td style="white-space:nowrap;">
                ${m.status!=='completed' ? `<button class="btn small" ${completeAttrs}>Complete</button>` : ''}
                <button class="btn small ghost" ${editAttrs}>Edit</button>
                <button class="btn small danger" ${deleteAttrs}>Delete</button>
              </td>
            </tr>
          `}).join('')}
        </tbody>
      </table>
    </div>
  `;
}

/* ============================= CREW ============================= */
function renderCrew(){
  return `
    <div class="toolbar">
      <div>
        <h2 class="section-title">Crew qualifications</h2>
        <p class="section-sub" style="margin-bottom:0;">Certification status for all crew, colour-coded by expiry. Advisory at 30 days, red alert at 7 days.</p>
      </div>
      <button class="btn primary" data-action="add-crew">+ Add crew member</button>
    </div>
    <div class="card-grid">
      ${state.crew.map(c=>{
        const expired = c.quals.filter(q=>qualStatus(q.expiry)==='expired');
        const dueSoon = c.quals.filter(q=>['red-alert','advisory'].includes(qualStatus(q.expiry)));
        const notifyGroup = (label, list, color)=>{
          if(list.length===0) return '';
          return `
          <div class="detail-section" style="margin-top:10px;">
            <h4 style="color:${color};">${label}</h4>
            ${list.map(q=>{
              const qs = qualStatus(q.expiry);
              const msg = qualNotifyText(c, q, qs);
              const subject = `Certification ${qs==='expired'?'expired':'expiring'}: ${q.name}`;
              return `
              <div style="padding:8px 0; border-bottom:1px dashed var(--paper-line);">
                <div style="font-size:12.5px; margin-bottom:6px;"><span class="stamp ${qs}" style="margin-right:6px;">${stampLabel(qs)}</span>${esc(q.name)} <span style="color:var(--ink-soft);">(${fmtDate(q.expiry)})</span></div>
                <div style="display:flex; gap:6px; flex-wrap:wrap;">
                  ${c.email ? `<a class="btn small" href="${mailtoLink(c.email, ADMIN_EMAIL, subject, msg)}">Email crew${ADMIN_EMAIL?' + admin':''}</a>` : ''}
                  ${c.phone ? `<a class="btn small ghost" href="${waLink(c.phone, msg)}" target="_blank" rel="noopener">WhatsApp crew</a>` : ''}
                  ${ADMIN_PHONE ? `<a class="btn small ghost" href="${waLink(ADMIN_PHONE, msg)}" target="_blank" rel="noopener">WhatsApp admin</a>` : ''}
                </div>
              </div>`;
            }).join('')}
          </div>`;
        };
        return `
        <div class="card" style="cursor:default;">
          <div class="card-top">
            <div>
              <h3>${esc(c.name)}</h3>
              <div class="meta-line">${esc(c.role)} · ${esc(vesselName(c.vesselId))}</div>
            </div>
            <div style="display:flex; gap:6px;">
              <button class="btn small ghost" data-action="edit-crew" data-id="${c.id}">Edit</button>
              <button class="btn small ghost" data-action="delete-crew" data-id="${c.id}">Remove</button>
            </div>
          </div>
          ${(c.email || c.phone) ? `
          <div style="display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; font-size:12px;">
            ${c.email ? `<a href="mailto:${esc(c.email)}" style="color:var(--seafoam); font-weight:600; text-decoration:none;">${esc(c.email)}</a>` : ''}
            ${c.phone ? `<a href="tel:${esc(c.phone.replace(/[^+\d]/g,''))}" style="color:var(--seafoam); font-weight:600; text-decoration:none;">${esc(c.phone)}</a>` : ''}
          </div>` : ''}
          <div style="margin-top:12px;">
            ${c.quals.length===0 ? '<span style="font-size:12px; color:var(--ink-soft);">No qualifications on file.</span>' : c.quals.map(q=>`
              <div class="mini-row">
                <span><span class="qual-dot ${qualStatus(q.expiry)}" style="display:inline-block; margin-right:6px;"></span>${esc(q.name)} <span style="color:var(--ink-soft); font-size:11px;">(${fmtDate(q.expiry)})</span></span>
                <span style="display:flex; gap:6px;">
                  <button class="btn small ghost" data-action="edit-qual" data-id="${c.id}" data-qual-id="${q.id}">Edit</button>
                  <button class="btn small danger" data-action="delete-qual" data-id="${c.id}" data-qual-id="${q.id}">Remove</button>
                </span>
              </div>
            `).join('')}
          </div>
          ${notifyGroup('Expired — notify now', expired, 'var(--signal-red)')}
          ${notifyGroup('Expiring soon — notify', dueSoon, 'var(--brass)')}
          <div class="detail-section" style="margin-top:10px;">
            <h4>Documents</h4>
            ${(c.documents||[]).length===0 ? '<div class="empty-note" style="padding:8px 0;">No documents on file.</div>' : c.documents.map(doc=>`
              <div class="mini-row">
                <span>${esc(doc.name)} <span style="color:var(--ink-soft); font-size:11px;">(${fmtDate(doc.addedDate)})</span></span>
                <span style="display:flex; align-items:center; gap:8px;">
                  <button class="btn small ghost" data-action="view-doc" data-scope="crew" data-id="${c.id}" data-doc-id="${doc.id}">View</button>
                  <button class="btn small danger" data-action="delete-crew-doc" data-id="${c.id}" data-doc-id="${doc.id}">Remove</button>
                </span>
              </div>
            `).join('')}
            <div style="margin-top:8px;"><button class="btn small" data-action="add-crew-doc" data-id="${c.id}">+ Add document</button></div>
          </div>
          <div style="margin-top:12px; padding-top:10px; border-top:1px dashed var(--paper-line);">
            <button class="btn small" data-action="add-qual" data-id="${c.id}">+ Add qualification</button>
          </div>
        </div>
      `}).join('')}
    </div>
  `;
}

/* Builds and downloads a PDF statement of a contractor's outstanding payments, then
   opens WhatsApp or email with a message so the just-downloaded file can be attached
   (a static page can't attach files to either automatically). */
function sendContractorStatement(id, channel){
  const ct = state.contractors.find(c=>c.id===id);
  if(!ct) return;
  const outstanding = (ct.payments||[]).filter(p=>p.status!=='paid');
  if(outstanding.length === 0){ alert('No outstanding payments for this contractor.'); return; }
  const total = outstanding.reduce((s,p)=>s+(Number(p.amount)||0),0);
  const todayStr = new Date().toLocaleDateString('en-ZA', {day:'2-digit', month:'short', year:'numeric'});

  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text('Ocean Hub — Fleet Operations', 14, 18);
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    doc.text('Outstanding payments statement', 14, 25);
    doc.text(`Date: ${todayStr}`, 14, 31);

    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text(ct.name || 'Contractor', 14, 42);
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    let y = 49;
    if(ct.contactName){ doc.text(`Attn: ${ct.contactName}`, 14, y); y += 6; }
    if(ct.email){ doc.text(`Email: ${ct.email}`, 14, y); y += 6; }
    if(ct.phone){ doc.text(`Phone: ${ct.phone}`, 14, y); y += 6; }
    y += 4;

    doc.setFont('helvetica','bold');
    doc.text('Description', 14, y); doc.text('Date', 130, y); doc.text('Amount', 170, y);
    doc.setFont('helvetica','normal');
    y += 3;
    doc.line(14, y, 196, y);
    y += 7;
    outstanding.forEach(p=>{
      const lines = doc.splitTextToSize(p.description || '', 108);
      doc.text(lines, 14, y);
      doc.text(p.date || '', 130, y);
      doc.text(fmtCurrency(p.amount), 170, y);
      y += Math.max(6, lines.length * 6);
      if(y > 270){ doc.addPage(); y = 20; }
    });
    y += 4;
    doc.line(14, y, 196, y);
    y += 8;
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text(`Total outstanding: ${fmtCurrency(total)}`, 14, y);

    const fileName = `Statement-${(ct.name||'contractor').replace(/[^a-z0-9]+/gi,'-')}-${new Date().toISOString().slice(0,10)}.pdf`;
    doc.save(fileName);
  }catch(e){
    alert('Could not generate the PDF. ' + (e && e.message ? e.message : ''));
    return;
  }

  const msg = `Hi${ct.contactName ? ' ' + ct.contactName : ''}, please find your outstanding payments statement from Ocean Hub — total ${fmtCurrency(total)} as of ${todayStr}. The PDF has just downloaded to this device — please attach it here.`;
  if(channel === 'whatsapp'){
    if(!ct.phone){ alert('No phone number on file for this contractor.'); return; }
    window.open(waLink(ct.phone, msg), '_blank');
  } else {
    if(!ct.email){ alert('No email address on file for this contractor.'); return; }
    window.open(mailtoLink(ct.email, ADMIN_EMAIL, `Outstanding payments statement — ${ct.name}`, msg), '_blank');
  }
}

function renderModal(){
  const root = document.getElementById('modalRoot');
  const modal = state.modal;
  if(!modal){ root.innerHTML=''; return; }
  let title = '', body = '';
  const cancelBtn = `<button type="button" class="btn ghost" data-action="close-modal">Cancel</button>`;
  const saveBtn = `<button type="submit" class="btn primary">Save</button>`;

  if(modal.type==='view-vessel'){
    root.innerHTML = `<div class="modal-overlay" data-action="overlay-close"><div class="modal" onclick="event.stopPropagation()">${renderVesselDetail(modal.id)}</div></div>`;
    attachModalEvents();
    return;
  }
  if(modal.type==='view-tender'){
    root.innerHTML = `<div class="modal-overlay" data-action="overlay-close"><div class="modal" onclick="event.stopPropagation()">${renderTenderDetail(modal.vesselId, modal.tenderId)}</div></div>`;
    attachModalEvents();
    return;
  }
  if(modal.type==='view-contractor'){
    root.innerHTML = `<div class="modal-overlay" data-action="overlay-close"><div class="modal" onclick="event.stopPropagation()">${renderContractorDetail(modal.id)}</div></div>`;
    attachModalEvents();
    return;
  }
  if(modal.type==='vessel'){ title = modal.data ? 'Edit vessel' : 'Add vessel'; body = vesselForm(modal.data); }
  else if(modal.type==='maintenance'){ title = modal.data ? 'Edit maintenance task' : 'Add maintenance task'; body = maintenanceForm(modal.data); }
  else if(modal.type==='crew'){ title = modal.data ? 'Edit crew member' : 'Add crew member'; body = crewForm(modal.data); }
  else if(modal.type==='qual'){ title = modal.data ? 'Edit qualification' : 'Add qualification'; body = qualForm(modal.data); }
  else if(modal.type==='vessel-cost'){ title = 'Add fixed cost'; body = vesselCostForm(); }
  else if(modal.type==='vessel-engine'){ title = modal.data ? 'Edit engine' : 'Add engine'; body = vesselEngineForm(modal.data); }
  else if(modal.type==='vessel-doc'){ title = 'Add vessel document'; body = documentForm(); }
  else if(modal.type==='crew-doc'){ title = 'Add crew document'; body = documentForm(); }
  else if(modal.type==='tender'){ title = modal.data ? 'Edit tender' : 'Add tender'; body = tenderForm(modal.data); }
  else if(modal.type==='tender-engine'){ title = modal.data ? 'Edit engine' : 'Add engine'; body = vesselEngineForm(modal.data); }
  else if(modal.type==='tender-task'){ title = modal.data ? 'Edit task' : 'Add task'; body = tenderMaintenanceForm(modal.data); }
  else if(modal.type==='tender-doc'){ title = 'Add tender document'; body = documentForm(); }
  else if(modal.type==='company'){ title = modal.data ? 'Edit company' : 'Add company'; body = companyForm(modal.data); }
  else if(modal.type==='contractor'){ title = modal.data ? 'Edit contractor' : 'Add contractor'; body = contractorForm(modal.data); }
  else if(modal.type==='contractor-payment'){ title = modal.data ? 'Edit payment' : 'Add payment'; body = contractorPaymentForm(modal.data); }

  root.innerHTML = `
    <div class="modal-overlay" data-action="overlay-close">
      <div class="modal" onclick="event.stopPropagation()">
        <form id="modalForm">
          <h3>${title}</h3>
          ${body}
          <div class="modal-actions">${cancelBtn}${saveBtn}</div>
        </form>
      </div>
    </div>
  `;
  attachModalEvents();
}

function attachModalEvents(){
  const overlay = document.querySelector('.modal-overlay');
  if(overlay){
    overlay.addEventListener('click', ()=>{ state.modal=null; render(); });
  }
  document.querySelectorAll('[data-action="close-modal"]').forEach(b=>b.addEventListener('click', (e)=>{ e.preventDefault(); state.modal=null; render(); }));
  document.querySelectorAll('[data-action="view-doc"]').forEach(b=>b.addEventListener('click', (e)=>{ e.preventDefault(); openStoredDocument(findStoredDocUrl(b.dataset)); }));
  const form = document.getElementById('modalForm');
  if(form) form.addEventListener('submit', handleFormSubmit);
  const photoInput = document.getElementById('vesselPhotoInput');
  if(photoInput){
    photoInput.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        const dataUrl = await resizeImageFile(file, 480, 0.6);
        document.getElementById('vesselPhotoHidden').value = dataUrl;
        document.getElementById('vesselPhotoPreview').innerHTML = `<img src="${dataUrl}" style="max-width:200px; max-height:140px; border-radius:6px; display:block;">`;
      }catch(err){
        alert("Couldn't process that photo. Try a different file.");
      }
    });
  }
  const removePhotoBtn = document.getElementById('removeVesselPhoto');
  if(removePhotoBtn){
    removePhotoBtn.addEventListener('click', ()=>{
      document.getElementById('vesselPhotoHidden').value = '';
      document.getElementById('vesselPhotoPreview').innerHTML = '';
      removePhotoBtn.remove();
    });
  }
  const docInput = document.getElementById('docFileInput');
  if(docInput){
    docInput.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const preview = document.getElementById('docPreview');
      preview.textContent = 'Processing…';
      try{
        const dataUrl = await processDocumentFile(file);
        document.getElementById('docDataHidden').value = dataUrl;
        document.getElementById('docFileNameHidden').value = file.name;
        const sizeKb = Math.round(dataUrl.length * 0.75 / 1024);
        preview.textContent = `${file.name} (${sizeKb} KB) ready to save.`;
      }catch(err){
        document.getElementById('docDataHidden').value = '';
        preview.textContent = '';
        alert(err.message || "Couldn't process that file.");
      }
    });
  }
  document.querySelectorAll('[data-action="edit-vessel"]').forEach(b=>b.addEventListener('click', ()=>{
    const v = state.vessels.find(x=>x.id===b.dataset.id);
    state.modal = { type:'vessel', data:v };
    renderModal();
  }));
  document.querySelectorAll('[data-action="delete-vessel"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(confirm('Delete this vessel? Related maintenance and crew assignment records will remain but show as unassigned.')){
      const vesselId = b.dataset.id;
      state.modal = null;
      await persistArray('vessels', fresh => fresh.filter(x=>x.id!==vesselId));
      render();
    }
  }));
  document.querySelectorAll('[data-action="add-vessel-cost"]').forEach(b=>b.addEventListener('click', ()=>{
    state.modal = { type:'vessel-cost', id:b.dataset.id };
    renderModal();
  }));
  document.querySelectorAll('[data-action="delete-vessel-cost"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Remove this fixed cost?')) return;
    const vesselId = b.dataset.id, costId = b.dataset.costId;
    state.modal = { type:'view-vessel', id:vesselId };
    await persistArray('vessels', fresh => fresh.map(v=> v.id===vesselId ? { ...v, fixedCosts:(v.fixedCosts||[]).filter(c=>c.id!==costId) } : v));
    render();

  document.querySelectorAll('[data-action="add-vessel-engine"]').forEach(b=>b.addEventListener('click', ()=>{
    state.modal = { type:'vessel-engine', id:b.dataset.id, data:null };
    renderModal();

  document.querySelectorAll('[data-action="edit-vessel-engine"]').forEach(b=>b.addEventListener('click', ()=>{

    const vesselId = b.dataset.id, tenderId = b.dataset.tenderId, docId = b.dataset.docId;
    state.modal = { type:'view-tender', vesselId, tenderId };
    await persistArray('vessels', fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const tenders = (v.tenders||[]).map(t=> t.id===tenderId ? { ...t, documents:(t.documents||[]).filter(d=>d.id!==docId) } : t);
      return { ...v, tenders };
    }));
    render();
  }));
  /* Scoped to .modal because reveal-password also appears in the (already-bound)
     companies/contractors list rows — an unscoped query here would double-bind those. */
  const modalEl = document.querySelector('.modal');
  if(modalEl){
    modalEl.querySelectorAll('[data-action="reveal-password"]').forEach(b=>b.addEventListener('click', ()=>{
      const span = b.previousElementSibling;
      if(span && span.classList.contains('pw-mask')){
        const shown = span.dataset.shown === '1';
        span.textContent = shown ? '••••••••' : (span.dataset.pw || '');
        span.dataset.shown = shown ? '0' : '1';
        b.textContent = shown ? 'Show' : 'Hide';
      }
    }));
  }
  document.querySelectorAll('[data-action="edit-contractor"]').forEach(b=>b.addEventListener('click', ()=>{
    state.modal = { type:'contractor', data: state.contractors.find(c=>c.id===b.dataset.id) };
    renderModal();
  }));
  document.querySelectorAll('[data-action="add-contractor-payment"]').forEach(b=>b.addEventListener('click', ()=>{
    state.modal = { type:'contractor-payment', id:b.dataset.id, data:null };
    renderModal();
  }));
  document.querySelectorAll('[data-action="edit-contractor-payment"]').forEach(b=>b.addEventListener('click', ()=>{
    const ct = state.contractors.find(x=>x.id===b.dataset.id);
    const pay = ct ? (ct.payments||[]).find(p=>p.id===b.dataset.payid) : null;
    state.modal = { type:'contractor-payment', id:b.dataset.id, data:pay };
    renderModal();
  }));
  document.querySelectorAll('[data-action="delete-contractor-payment"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Delete this payment record?')) return;
    const contractorId = b.dataset.id, payId = b.dataset.payid;
    state.modal = { type:'view-contractor', id:contractorId };
    await persistArray('contractors', fresh => fresh.map(c=> c.id===contractorId ? { ...c, payments:(c.payments||[]).filter(p=>p.id!==payId) } : c));
    render();
  }));
  document.querySelectorAll('[data-action="send-contractor-statement"]').forEach(b=>b.addEventListener('click', ()=>{
    sendContractorStatement(b.dataset.id, b.dataset.channel);
  }));
}

async function handleFormSubmit(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const modal = state.modal;
  let targetKey = null, mutateFn = null, nextModal = null;

  if(modal.type==='vessel'){
    const data = { name:fd.get('name'), type:fd.get('type'), reg:fd.get('reg'), status:fd.get('status'), engineHours:Number(fd.get('engineHours'))||0, notes:fd.get('notes')||'', photo:fd.get('photo')||'', ownerName:fd.get('ownerName')||'', ownerPhone:fd.get('ownerPhone')||'', ownerEmail:fd.get('ownerEmail')||'' };
    const editId = modal.data ? modal.data.id : null;
    targetKey = 'vessels';
    mutateFn = fresh => editId
      ? fresh.map(v=> v.id===editId ? { ...v, ...data } : v)
      : [...fresh, { id:uid('v'), fixedCosts:[], documents:[], engines:[], ...data }];
  }
  else if(modal.type==='maintenance'){
    const data = { vesselId:fd.get('vesselId'), category:fd.get('category'), title:fd.get('title'), description:fd.get('description')||'', dueDate:fd.get('dueDate'), cost:Number(fd.get('cost'))||0, priority:fd.get('priority'),
      billing: fd.get('billing') || (modal.data ? billingOf(modal.data) : 'none') };
    const editId = modal.data ? modal.data.id : null;
    targetKey = 'maintenance';
    mutateFn = fresh => editId
      ? fresh.map(m=> m.id===editId ? { ...m, ...data } : m)
      : [...fresh, { id:uid('m'), status:'upcoming', ...data }];
  }
  else if(modal.type==='crew'){
    const data = { name:fd.get('name'), role:fd.get('role'), vesselId:fd.get('vesselId'), email:fd.get('email')||'', phone:fd.get('phone')||'' };
    const editId = modal.data ? modal.data.id : null;
    targetKey = 'crew';
    mutateFn = fresh => editId
      ? fresh.map(c=> c.id===editId ? { ...c, ...data } : c)
      : [...fresh, { id:uid('c'), quals:[], documents:[], ...data }];
  }
  else if(modal.type==='qual'){
    const data = { name:fd.get('name'), expiry:fd.get('expiry') };
    const crewId = modal.id;
    const editQualId = modal.data ? modal.data.id : null;
    targetKey = 'crew';
    mutateFn = fresh => fresh.map(c=>{
      if(c.id!==crewId) return c;
      const quals = c.quals || [];
      const newQuals = editQualId
        ? quals.map(q=> q.id===editQualId ? { ...q, ...data } : q)
        : [...quals, { id:uid('q'), ...data }];
      return { ...c, quals: newQuals };
    });
  }
  else if(modal.type==='vessel-cost'){
    const data = { label:fd.get('label'), amount:Number(fd.get('amount'))||0, frequency:fd.get('frequency') };
    const vesselId = modal.id;
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=> v.id===vesselId ? { ...v, fixedCosts:[...(v.fixedCosts||[]), { id:uid('fc'), ...data }] } : v);
    nextModal = { type:'view-vessel', id: vesselId };
  }
  else if(modal.type==='vessel-engine'){
    const data = { label:fd.get('engineLabel')||'', type:fd.get('engineType'), serial:fd.get('engineSerial'), hours:Number(fd.get('engineHrs'))||0 };
    const vesselId = modal.id;
    const editEngineId = modal.data ? modal.data.id : null;
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const engines = v.engines || [];
      const newEngines = editEngineId
        ? engines.map(en=> en.id===editEngineId ? { ...en, ...data } : en)
        : [...engines, { id:uid('en'), ...data }];
      return { ...v, engines: newEngines };
    });
    nextModal = { type:'view-vessel', id: vesselId };
  }
  else if(modal.type==='vessel-doc'){
    const dataUrl = fd.get('docData');
    if(!dataUrl){ alert('Please choose a file first.'); return; }
    const vesselId = modal.id;
    const docData = { id:uid('doc'), name:fd.get('docName'), fileName:fd.get('docFileName')||'', dataUrl, addedDate:new Date().toISOString().slice(0,10) };
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=> v.id===vesselId ? { ...v, documents:[...(v.documents||[]), docData] } : v);
    nextModal = { type:'view-vessel', id: vesselId };
  }
  else if(modal.type==='crew-doc'){
    const dataUrl = fd.get('docData');
    if(!dataUrl){ alert('Please choose a file first.'); return; }
    const crewId = modal.id;
    const docData = { id:uid('doc'), name:fd.get('docName'), fileName:fd.get('docFileName')||'', dataUrl, addedDate:new Date().toISOString().slice(0,10) };
    targetKey = 'crew';
    mutateFn = fresh => fresh.map(c=> c.id===crewId ? { ...c, documents:[...(c.documents||[]), docData] } : c);
  }
  else if(modal.type==='tender'){
    const data = { name:fd.get('tenderName'), type:fd.get('tenderType')||'', reg:fd.get('tenderReg')||'' };
    const vesselId = modal.vesselId;
    const editId = modal.data ? modal.data.id : null;
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const tenders = v.tenders || [];
      const newTenders = editId
        ? tenders.map(t=> t.id===editId ? { ...t, ...data } : t)
        : [...tenders, { id:uid('tn'), engines:[], documents:[], maintenance:[], ...data }];
      return { ...v, tenders: newTenders };
    });
    nextModal = editId ? { type:'view-tender', vesselId, tenderId: editId } : { type:'view-vessel', id: vesselId };
  }
  else if(modal.type==='tender-engine'){
    const data = { label:fd.get('engineLabel')||'', type:fd.get('engineType'), serial:fd.get('engineSerial'), hours:Number(fd.get('engineHrs'))||0 };
    const vesselId = modal.vesselId, tenderId = modal.tenderId;
    const editEngineId = modal.data ? modal.data.id : null;
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const tenders = (v.tenders||[]).map(t=>{
        if(t.id!==tenderId) return t;
        const engines = t.engines || [];
        const newEngines = editEngineId
          ? engines.map(en=> en.id===editEngineId ? { ...en, ...data } : en)
          : [...engines, { id:uid('en'), ...data }];
        return { ...t, engines: newEngines };
      });
      return { ...v, tenders };
    });
    nextModal = { type:'view-tender', vesselId, tenderId };
  }
  else if(modal.type==='tender-task'){
    const data = { title:fd.get('title'), description:fd.get('description')||'', category:fd.get('category'), dueDate:fd.get('dueDate'), priority:fd.get('priority'), cost:Number(fd.get('cost'))||0,
      billing: fd.get('billing') || (modal.data ? billingOf(modal.data) : 'none') };
    const vesselId = modal.vesselId, tenderId = modal.tenderId;
    const editTaskId = modal.data ? modal.data.id : null;
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const tenders = (v.tenders||[]).map(t=>{
        if(t.id!==tenderId) return t;
        const tasks = t.maintenance || [];
        const newTasks = editTaskId
          ? tasks.map(m=> m.id===editTaskId ? { ...m, ...data } : m)
          : [...tasks, { id:uid('tm'), status:'upcoming', ...data }];
        return { ...t, maintenance: newTasks };
      });
      return { ...v, tenders };
    });
    nextModal = { type:'view-tender', vesselId, tenderId };
  }
  else if(modal.type==='tender-doc'){
    const dataUrl = fd.get('docData');
    if(!dataUrl){ alert('Please choose a file first.'); return; }
    const vesselId = modal.vesselId, tenderId = modal.tenderId;
    const docData = { id:uid('doc'), name:fd.get('docName'), fileName:fd.get('docFileName')||'', dataUrl, addedDate:new Date().toISOString().slice(0,10) };
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const tenders = (v.tenders||[]).map(t=> t.id===tenderId ? { ...t, documents:[...(t.documents||[]), docData] } : t);
      return { ...v, tenders };
    });
    nextModal = { type:'view-tender', vesselId, tenderId };
  }
  else if(modal.type==='company'){
    const editId = modal.data ? modal.data.id : null;
    const uname = (fd.get('username')||'').trim();
    if(uname && state.companies.some(c => c.id !== editId && (c.username||'').trim().toLowerCase() === uname.toLowerCase())){
      alert('Another company already uses that username. Please choose a different one.');
      return;
    }
    const data = {
      name:fd.get('name'), contactName:fd.get('contactName')||'', contactEmail:fd.get('contactEmail')||'',
      contactPhone:fd.get('contactPhone')||'', address:fd.get('address')||'', notes:fd.get('notes')||'',
      username:uname, password:fd.get('password')||'', vesselIds:fd.getAll('vesselIds')
    };
    targetKey = 'companies';
    mutateFn = fresh => editId
      ? fresh.map(c=> c.id===editId ? { ...c, ...data } : c)
      : [...fresh, { id:uid('co'), ...data }];
  }
  else if(modal.type==='contractor'){
    const data = {
      name:fd.get('name'), contactName:fd.get('contactName')||'', email:fd.get('email')||'', phone:fd.get('phone')||'',
      bankName:fd.get('bankName')||'', accountHolder:fd.get('accountHolder')||'', accountNumber:fd.get('accountNumber')||'',
      branchCode:fd.get('branchCode')||'', accountType:fd.get('accountType')||'', swift:fd.get('swift')||'', notes:fd.get('notes')||''
    };
    const editId = modal.data ? modal.data.id : null;
    targetKey = 'contractors';
    mutateFn = fresh => editId
      ? fresh.map(c=> c.id===editId ? { ...c, ...data } : c)
      : [...fresh, { id:uid('ct'), payments:[], ...data }];
    nextModal = editId ? { type:'view-contractor', id: editId } : null;
  }
  else if(modal.type==='contractor-payment'){
    const data = { description:fd.get('description'), amount:Number(fd.get('amount'))||0, date:fd.get('date'), status:fd.get('status') };
    const contractorId = modal.id;
    const editPayId = modal.data ? modal.data.id : null;
    targetKey = 'contractors';
    mutateFn = fresh => fresh.map(c=>{
      if(c.id!==contractorId) return c;
      const payments = c.payments || [];
      const newPayments = editPayId
        ? payments.map(p=> p.id===editPayId ? { ...p, ...data } : p)
        : [...payments, { id:uid('pay'), ...data }];
      return { ...c, payments: newPayments };
    });
    nextModal = { type:'view-contractor', id: contractorId };
  }

  if(targetKey && mutateFn){
    await persistArray(targetKey, mutateFn);
  }
  state.modal = nextModal;
  render();
}

/* ============================= GLOBAL ACTIONS ============================= */
function attachContentEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    const action = el.dataset.action;
    if(['close-modal','overlay-close','edit-vessel','delete-vessel','edit-contractor','add-contractor-payment','edit-contractor-payment','delete-contractor-payment','send-contractor-statement'].includes(action)) return;
    el.addEventListener('click', async ()=>{
      const id = el.dataset.id;
      switch(action){
        case 'add-vessel': state.modal = { type:'vessel', data:null }; renderModal(); break;
        case 'view-vessel': state.modal = { type:'view-vessel', id }; renderModal(); break;
        case 'add-maintenance': state.modal = { type:'maintenance', data:null }; renderModal(); break;
        case 'edit-maintenance': state.modal = { type:'maintenance', data: state.maintenance.find(m=>m.id===id) }; renderModal(); break;
        case 'delete-maintenance':
          if(confirm('Delete this maintenance task?')){
            await persistArray('maintenance', fresh => fresh.filter(m=>m.id!==id));
            render();
          }
          break;
        case 'complete-task':
          await persistArray('maintenance', fresh => fresh.map(m=> m.id===id ? { ...m, status:'completed', completedDate:new Date().toISOString().slice(0,10) } : m));
          render();
          break;
        case 'edit-tender-task':
          { const v = state.vessels.find(x=>x.id===id); const t = v ? (v.tenders||[]).find(tt=>tt.id===el.dataset.tenderId) : null; const task = t ? (t.maintenance||[]).find(m=>m.id===el.dataset.taskId) : null;
            state.modal = { type:'tender-task', vesselId:id, tenderId:el.dataset.tenderId, data:task }; renderModal(); }
          break;
        case 'complete-tender-task':
          { const vesselId = id, tenderId = el.dataset.tenderId, taskId = el.dataset.taskId;
            await persistArray('vessels', fresh => fresh.map(v=>{
              if(v.id!==vesselId) return v;
              const tenders = (v.tenders||[]).map(t=>{
                if(t.id!==tenderId) return t;
                const tasks = (t.maintenance||[]).map(m=> m.id===taskId ? { ...m, status:'completed', completedDate:new Date().toISOString().slice(0,10) } : m);
                return { ...t, maintenance: tasks };
              });
              return { ...v, tenders };
            }));
            render(); }
          break;
        case 'delete-tender-task':
          if(confirm('Delete this maintenance task?')){
            const vesselId = id, tenderId = el.dataset.tenderId, taskId = el.dataset.taskId;
            await persistArray('vessels', fresh => fresh.map(v=>{
              if(v.id!==vesselId) return v;
              const tenders = (v.tenders||[]).map(t=> t.id===tenderId ? { ...t, maintenance:(t.maintenance||[]).filter(m=>m.id!==taskId) } : t);
              return { ...v, tenders };
            }));
            render();
          }
          break;
        case 'add-crew': state.modal = { type:'crew', data:null }; renderModal(); break;
        case 'edit-crew': state.modal = { type:'crew', data: state.crew.find(c=>c.id===id) }; renderModal(); break;
        case 'delete-crew':
          if(confirm('Remove this crew member?')){
            await persistArray('crew', fresh => fresh.filter(c=>c.id!==id));
            render();
          }
          break;
        case 'add-qual': state.modal = { type:'qual', id, data:null }; renderModal(); break;
        case 'edit-qual':
          { const c = state.crew.find(x=>x.id===id); const q = c ? c.quals.find(qq=>qq.id===el.dataset.qualId) : null; state.modal = { type:'qual', id, data:q }; renderModal(); }
          break;
        case 'delete-qual':
          if(confirm('Remove this qualification?')){
            const qualId = el.dataset.qualId;
            await persistArray('crew', fresh => fresh.map(c=> c.id===id ? { ...c, quals:(c.quals||[]).filter(qq=>qq.id!==qualId) } : c));
            render();
          }
          break;
        case 'add-crew-doc': state.modal = { type:'crew-doc', id }; renderModal(); break;
        case 'delete-crew-doc':
          if(confirm('Remove this document? This cannot be undone.')){
            const docId = el.dataset.docId;
            await persistArray('crew', fresh => fresh.map(c=> c.id===id ? { ...c, documents:(c.documents||[]).filter(d=>d.id!==docId) } : c));
            render();
          }
          break;
        case 'add-company': state.modal = { type:'company', data:null }; renderModal(); break;
        case 'edit-company': state.modal = { type:'company', data: state.companies.find(c=>c.id===id) }; renderModal(); break;
        case 'delete-company':
          if(confirm('Delete this company and its owner login? The vessels and their records are kept.')){
            await persistArray('companies', fresh => fresh.filter(c=>c.id!==id));
            render();
          }
          break;
        case 'add-contractor': state.modal = { type:'contractor', data:null }; renderModal(); break;
        case 'view-contractor': state.modal = { type:'view-contractor', id }; renderModal(); break;
        case 'delete-contractor':
          if(confirm('Delete this contractor and their payment records?')){
            await persistArray('contractors', fresh => fresh.filter(c=>c.id!==id));
            state.modal = null;
            render();
          }
          break;
        case 'reveal-password': {
          const span = el.previousElementSibling;
          if(span && span.classList.contains('pw-mask')){
            const shown = span.dataset.shown === '1';
            span.textContent = shown ? '••••••••' : (span.dataset.pw || '');
            span.dataset.shown = shown ? '0' : '1';
            el.textContent = shown ? 'Show' : 'Hide';
          }
          break;
        }
        case 'billing-tab':
          state.filters.billing = el.dataset.billing;
          render();
          break;
        case 'view-doc':
          openStoredDocument(findStoredDocUrl(el.dataset));
          break;
        case 'logout':
          if(confirm('Sign out? You will need to sign in again to get back in.')){ await logout(); }
          break;
      }
    });
  });

  const fv = document.getElementById('filterVessel');
  const fc = document.getElementById('filterCategory');
  const fs = document.getElementById('filterStatus');
  if(fv) fv.addEventListener('change', ()=>{ state.filters.vessel=fv.value; render(); });
  if(fc) fc.addEventListener('change', ()=>{ state.filters.category=fc.value; render(); });
  if(fs) fs.addEventListener('change', ()=>{ state.filters.status=fs.value; render(); });
}

/* ============================= RENDER DISPATCH ============================= */
function render(){
  if(!session){ renderLoginGate(); return; }
  if(session.role === 'owner' && !currentCompany()){
    /* the company/login was removed or reassigned while signed in */
    session = null;
    saveSession();
    renderLoginGate('Your access has changed — please sign in again.');
    return;
  }
  applyScoping();
  renderHeaderMeta();
  renderNav();
  const allowed = navTabs().map(t=>t.id);
  if(!allowed.includes(state.activeTab)) state.activeTab = 'dashboard';
  const main = document.getElementById('mainContent');
  switch(state.activeTab){
    case 'dashboard': main.innerHTML = renderDashboard(); break;
    case 'vessels': main.innerHTML = renderVessels(); break;
    case 'maintenance': main.innerHTML = renderMaintenance(); break;
    case 'crew': main.innerHTML = renderCrew(); break;
    case 'companies': main.innerHTML = renderCompanies(); break;
    case 'contractors': main.innerHTML = renderContractors(); break;
  }
  attachContentEvents();
  renderModal();
}

bootstrap();
</script>
