/* ---------- Invoice scanning ---------- */
/* A photo or PDF of an invoice is read by Gemini through Firebase AI Logic (Gemini Developer API,
   free tier — switched on in the Firebase console under AI Logic). Each invoice line comes back as
   its own cost for the user to check; saving adds them to Finance with a copy of the invoice kept
   at oceanhub/files. The AI library only loads the first time someone scans. */
const INVOICE_MODEL = 'gemini-3.5-flash';
const INVOICE_MAX_BYTES = 15 * 1024 * 1024; /* all pages together, as sent to Gemini */
const INVOICE_PROMPT = `You are reading a supplier invoice, receipt or quote for a South African boat and vessel operator. Extract it as JSON.
- supplier: the business that issued the document (not the customer / bill-to).
- invoiceDate: as YYYY-MM-DD. South African dates are usually written day first (dd/mm/yyyy).
- currency: ISO code, e.g. ZAR.
- lines: every charged line, in the order printed. description: short but specific, keeping part numbers and sizes that help identify it. quantity: as printed. amount: the line total as printed, after any line discount.
- Delivery, freight, call-out, labour, travel and similar charges are lines of their own. An invoice-level discount is a line with a negative amount.
- Never list VAT, subtotals, totals, balances, payments or deposits as lines.
- amountsIncludeVat: true only if the printed line amounts already include VAT.
- vatAmount: total VAT on the document, 0 if none. total: the grand total payable.
- category for each line: "parts" for goods, parts, consumables and materials; "service" for labour, servicing, call-outs, travel, delivery, hire and other work. Use "scheduled" only when the line clearly says it is a scheduled, routine or interval service, and "unscheduled" only when it clearly describes a breakdown, emergency or repair call-out.
- Numbers only, without currency symbols or thousands separators.
- If the document is not an invoice, receipt or quote, set isInvoice to false and return no lines.`;

let invoiceModelPromise = null;
function invoiceModel(){
  if(!invoiceModelPromise){
    invoiceModelPromise = (async ()=>{
      const appMod = await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js');
      const ai = await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-ai.js');
      const app = appMod.getApps().find(a=>a.name==='invoice-reader') || appMod.initializeApp(FIREBASE_CONFIG, 'invoice-reader');
      const S = ai.Schema;
      const schema = S.object({
        properties: {
          isInvoice: S.boolean(),
          supplier: S.object({ properties:{ name:S.string(), contactName:S.string(), phone:S.string(), email:S.string() }, optionalProperties:['name','contactName','phone','email'] }),
          invoiceNumber: S.string(),
          invoiceDate: S.string(),
          currency: S.string(),
          amountsIncludeVat: S.boolean(),
          vatAmount: S.number(),
          total: S.number(),
          lines: S.array({ items: S.object({ properties:{
            description: S.string(), quantity: S.number(), amount: S.number(),
            category: S.enumString({ enum: FIN_CATEGORIES.map(c=>c.id) })
          }, optionalProperties:['quantity'] }) })
        },
        optionalProperties: ['supplier','invoiceNumber','invoiceDate','currency','vatAmount','total']
      });
      return ai.getGenerativeModel(ai.getAI(app, { backend: new ai.GoogleAIBackend() }), {
        model: INVOICE_MODEL,
        generationConfig: { responseMimeType:'application/json', responseSchema:schema, temperature:0 }
      });
    })().catch(err=>{ invoiceModelPromise = null; throw err; });
  }
  return invoiceModelPromise;
}

function invoiceErrorText(err){
  const s = String((err && (err.code || '')) + ' ' + (err && err.message || err));
  if(/api-not-enabled|SERVICE_DISABLED|has not been used|is disabled/i.test(s))
    return 'Invoice reading isn\'t switched on yet. The OCEANHUB admin needs to open the Firebase console, go to AI Logic and click "Get started" with the Gemini Developer API.';
  if(/429|quota|RESOURCE_EXHAUSTED|rate limit/i.test(s))
    return 'The free daily allowance for reading invoices has been used up. Try again later, or add these costs by hand with "+ Add cost".';
  if(/failed to fetch|network|offline/i.test(s)) return 'No connection — check your internet and try again.';
  if(/import|dynamically imported module/i.test(s)) return 'Couldn\'t load the invoice reader — check your connection and try again.';
  return 'Couldn\'t read that invoice: ' + ((err && err.message) || s);
}

function fmtRand2(n){ return (n < 0 ? '-R' : 'R') + Math.abs(Number(n)||0).toLocaleString('en-ZA', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
const round2 = n => Math.round((Number(n)||0) * 100) / 100;
function dataUrlBytes(dataUrl){ return Math.round((dataUrl.length - dataUrl.indexOf(',') - 1) * 0.75); }

/* What the ticked lines come to, with the chosen VAT handling applied. */
function invoiceCostsFromForm(form, m){
  const r = m.result || {};
  const rows = [...form.querySelectorAll('.inv-line')].map(row=>({
    include: row.querySelector('[name=lineOn]').checked,
    description: row.querySelector('[name=lineDesc]').value.trim(),
    category: row.querySelector('[name=lineCat]').value,
    amount: Number(row.querySelector('[name=lineAmount]').value) || 0
  }));
  const picked = rows.filter(l=>l.include && (l.description || l.amount));
  const allSum = rows.reduce((s,l)=>s+l.amount, 0);
  const pickedSum = picked.reduce((s,l)=>s+l.amount, 0);
  const vat = Number(r.vatAmount) || 0;
  const mode = form.elements.vatMode ? form.elements.vatMode.value : 'none';
  let costs = picked.map(l=>({ ...l, vatNote:'' }));
  if(mode === 'spread' && allSum){
    const rate = vat / allSum; /* VAT rate implied by the invoice, so unticked lines don't push their VAT onto others */
    costs = costs.map(l=>({ ...l, amount: l.amount * (1 + rate), vatNote:'incl. VAT' }));
  } else if(mode === 'line' && allSum && pickedSum){
    const biggest = picked.slice().sort((a,b)=>b.amount-a.amount)[0];
    costs.push({ description:'VAT' + (form.elements.invoiceRef.value.trim() ? ` — invoice ${form.elements.invoiceRef.value.trim()}` : ''), category:biggest.category, amount: vat * pickedSum / allSum, vatNote:'' });
  }
  return { costs: costs.map(c=>({ ...c, amount: round2(c.amount) })), rows };
}

function updateInvoiceTotals(form, m){
  const { costs, rows } = invoiceCostsFromForm(form, m);
  const total = costs.reduce((s,c)=>s+c.amount, 0);
  document.getElementById('invAddTotal').textContent = `${fmtRand2(total)} (${costs.length} cost${costs.length===1?'':'s'})`;
  form.querySelectorAll('.inv-line').forEach((row, i)=>row.classList.toggle('off', !rows[i].include));
  const invTotal = Number((m.result||{}).total) || 0;
  const mode = form.elements.vatMode ? form.elements.vatMode.value : 'none';
  const allTicked = rows.every(l=>l.include);
  const note = document.getElementById('invTotalNote');
  note.style.color = '';
  if(invTotal && allTicked && mode !== 'exclude' && Math.abs(total - invTotal) > 1){
    note.textContent = `These come to ${fmtRand2(Math.abs(total - invTotal))} ${total > invTotal ? 'more' : 'less'} than the invoice total — check the amounts against the invoice.`;
    note.style.color = 'var(--brass)';
  } else note.textContent = '';

}

async function addInvoiceFiles(input){
  const m = state.modal;
  const files = [...(input.files || [])];
  input.value = '';
  if(!files.length || !m) return;
  m.error = '';
  for(const file of files){
    try{
      if(file.type === 'application/pdf' || /\.pdf$/i.test(file.name)){
        const dataUrl = await readFileAsDataURL(file);
        m.files.push({ name:file.name, mime:'application/pdf', dataUrl: dataUrl.replace(/^data:[^;,]*/, 'data:application/pdf') });
      } else if(/^image\//.test(file.type) || /\.(jpe?g|png|heic|heif|webp)$/i.test(file.name)){
        /* big enough to keep small print legible, small enough to send and store */
        m.files.push({ name:file.name || `Photo ${m.files.length+1}.jpg`, mime:'image/jpeg', dataUrl: await resizeImageFile(file, 2000, 0.82) });
      } else {
        m.error = `${file.name} isn't a photo or PDF.`;
      }
    }catch(e){
      m.error = `Couldn't open ${file.name || 'that file'} — try a different photo or file.`;
    }
  }
  if(m.files.reduce((s,f)=>s+dataUrlBytes(f.dataUrl), 0) > INVOICE_MAX_BYTES){
    m.files.pop();
    m.error = 'That makes the invoice too large to read in one go (15 MB). Use a smaller PDF, or photograph the pages instead.';
  }
  if(state.modal === m) renderModal();
}

async function readInvoice(){
  const m = state.modal;
  if(!m || !m.files.length) return;
  m.step = 'reading'; m.error = '';
  renderModal();
  try{
    const model = await invoiceModel();
    const parts = [{ text: INVOICE_PROMPT }, ...m.files.map(f=>({ inlineData:{ mimeType:f.mime, data:f.dataUrl.slice(f.dataUrl.indexOf(',') + 1) } }))];
    const res = await model.generateContent(parts);
    const r = JSON.parse(res.response.text());
    if(state.modal !== m) return; /* cancelled while reading */
    if(!r.isInvoice || !(r.lines||[]).length){
      m.step = 'pick';
      m.error = r.isInvoice === false ? "That doesn't look like an invoice, receipt or quote. Try a clearer photo, or add the cost by hand." : 'No lines could be read from that invoice. Try a clearer, flatter photo in good light.';
      renderModal();
      return;
    }
    m.result = r;
    m.lines = r.lines.map(l=>({ description: (Number(l.quantity) > 1 && !/^\s*\d/.test(l.description||'') ? `${Number(l.quantity)} × ` : '') + (l.description||''),
      category: FIN_CATEGORIES.some(c=>c.id===l.category) ? l.category : 'parts', amount: Number(l.amount)||0 }));
    m.step = 'review';
    renderModal();
  }catch(err){
    console.warn('Invoice reading failed', err);
    if(state.modal !== m) return;
    m.step = 'pick';
    m.error = invoiceErrorText(err);
    renderModal();
  }
}

async function saveInvoiceCosts(form){
  const m = state.modal;
  const btn = document.getElementById('invSaveBtn');
  const { costs } = invoiceCostsFromForm(form, m);
  const fd = new FormData(form);
  const t = k => String(fd.get(k)||'').trim();
  if(!fd.get('date')){ alert('Enter the invoice date as dd/mm/yyyy.'); return; }
  if(!costs.length){ alert('Tick at least one line to add.'); return; }
  if(costs.some(c=>!c.description)){ alert('Every ticked line needs a description.'); return; }
  btn.disabled = true; btn.textContent = 'Saving…';
  let fileRefs = m.files.map((f, i)=>({ id:uid('invf'), name: m.files.length > 1 ? `Invoice page ${i+1}` : (f.name || 'Invoice') }));
  try{ await Promise.all(fileRefs.map((ref, i)=>storeDocFile(ref.id, m.files[i].dataUrl))); }
  catch(e){
    if(!confirm("Couldn't save a copy of the invoice. Add the costs without it?")){ btn.disabled = false; updateInvoiceTotals(form, m); return; }
    fileRefs = [];
  }
  const shared = { vesselId:fd.get('vesselId'), date:fd.get('date'), invoiceRef:t('invoiceRef'),
    provider:{ name:t('providerName'), contactName:t('providerContact'), phone:t('providerPhone'), email:t('providerEmail') },
    invoiceFiles:fileRefs, createdBy: session ? session.email : '', createdDate: localISODate(new Date()) };
  const items = costs.map(c=>({ id:uid('fi'), ...shared, category:c.category, description:c.description, cost:c.amount, notes:c.vatNote }));
  const saved = await persistArray('financeItems', fresh => [...fresh, ...items]);
  if(!saved){
    await removeDocFiles(fileRefs);
    alert("Couldn't save the costs — check your connection and try again.");
    btn.disabled = false; updateInvoiceTotals(form, m);
    return;
  }
  state.modal = null;
  render();
}

function wireInvoiceScan(){
  const m = state.modal;
  document.querySelectorAll('[data-inv-file]').forEach(input=>input.addEventListener('change', ()=>addInvoiceFiles(input)));
  document.querySelectorAll('[data-inv]').forEach(btn=>btn.addEventListener('click', e=>{
    e.preventDefault();
    const what = btn.dataset.inv;
    if(what === 'remove-file'){ m.files.splice(Number(btn.dataset.index), 1); m.error = ''; renderModal(); }
    else if(what === 'read') readInvoice();
    else if(what === 'add-line'){
      document.getElementById('invLines').insertAdjacentHTML('beforeend', invoiceLineRow({ description:'', category:'parts', amount:'' }));
      updateInvoiceTotals(document.getElementById('invoiceForm'), m);
      const rows = document.querySelectorAll('#invLines .inv-line');
      rows[rows.length-1].querySelector('[name=lineDesc]').focus();
    }
  }));
  const form = document.getElementById('invoiceForm');
  if(!form) return;
  form.addEventListener('input', ()=>updateInvoiceTotals(form, m));
  form.addEventListener('change', ()=>updateInvoiceTotals(form, m));
  form.addEventListener('submit', e=>{ e.preventDefault(); saveInvoiceCosts(form); });
  /* a provider used before fills in their details where still blank */
  form.elements.providerName.addEventListener('input', ()=>{
    const p = knownProviders().get(form.elements.providerName.value.trim().toLowerCase());
    if(!p) return;
    [['providerContact','contactName'],['providerPhone','phone'],['providerEmail','email']].forEach(([field, key])=>{
      if(!form.elements[field].value && p[key]) form.elements[field].value = p[key];
    });
  });
  updateInvoiceTotals(form, m);
}

/* Reads the report and budget settings off the page into state, so a live refresh keeps them. */
function captureFinControls(){
  const f = state.fin;
  const val = id => { const el = document.getElementById(id); return el ? el.value : null; };
  if(val('finPeriod') != null) f.period = val('finPeriod');
  if(val('finVessel') != null) f.vessel = val('finVessel');
  if(val('finMonth') != null) f.month = Number(val('finMonth'));
  if(val('finYear') != null) f.year = Number(val('finYear'));
  if(val('finEntryCat') != null) f.entryCat = val('finEntryCat');
  if(val('budYear') != null) f.budget.year = Number(val('budYear'));
  if(val('budStart') != null) f.budget.startMonth = Number(val('budStart'));
  if(val('budBase') != null) f.budget.baseYears = Number(val('budBase'));
  if(val('budUplift') != null) f.budget.uplift = val('budUplift') === '' ? 0 : Number(val('budUplift'));
  const from = document.querySelector('input[type=hidden][name=finFrom]');
  const to = document.querySelector('input[type=hidden][name=finTo]');
  if(from) f.from = from.value;
  if(to) f.to = to.value;
}

/* ---------- PDF / CSV builders ---------- */
function newPdf(title, lines){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('OCEANHUB — Vessel Manager', 14, 18);
  doc.setFontSize(12);
  doc.text(title, 14, 26);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  let y = 33;
  lines.filter(Boolean).forEach(l=>{ const w = doc.splitTextToSize(l, 182); doc.text(w, 14, y); y += w.length * 5.5; });
  return { doc, y: y + 3 };
}
/* Draws a table from x=14 across 182mm, wrapping cells and repeating the header on new pages. */
function pdfTable(doc, y, cols, rows, opts){
  opts = opts || {};
  const header = ()=>{
    doc.setFont('helvetica','bold'); doc.setFontSize(9);
    let x = 14;
    cols.forEach(c=>{ doc.text(c.label, c.align==='right' ? x + c.w - 1 : x, y, c.align==='right' ? { align:'right' } : undefined); x += c.w; });
    y += 2; doc.line(14, y, 196, y); y += 5;
    doc.setFont('helvetica','normal');
  };
  header();
  rows.forEach((row, ri)=>{
    const cells = row.map((v, i)=> doc.splitTextToSize(String(v==null?'':v), cols[i].w - 2));
    const h = Math.max(...cells.map(c=>c.length)) * 4.2 + 2;
    if(y + h > 280){ doc.addPage(); y = 20; header(); }
    if(opts.boldRows && opts.boldRows.includes(ri)) doc.setFont('helvetica','bold');
    let x = 14;
    cells.forEach((c, i)=>{ const col = cols[i]; doc.text(c, col.align==='right' ? x + col.w - 1 : x, y, col.align==='right' ? { align:'right' } : undefined); x += col.w; });
    doc.setFont('helvetica','normal');
    y += h;
  });
  return y;
}
function pdfFooter(doc){
  const pageCount = doc.getNumberOfPages();
  for(let i = 1; i <= pageCount; i++){
    doc.setPage(i);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(120);
    doc.text(`Sent with OCEANHUB Vessel Manager · page ${i} of ${pageCount}`, 105, 290, { align:'center' });
  }
  doc.setTextColor(0);
}
/* Spreadsheet-safe CSV: quoted where needed, and text that starts like a formula is
   prefixed so Excel shows it rather than running it. */
function toCsv(rows){
  return rows.map(r=>r.map(c=>{
    if(typeof c === 'number') return String(c);
    let s = c==null ? '' : String(c);
    if(/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(',')).join('\r\n');
}
function csvFile(rows, name){ return new File(['﻿' + toCsv(rows)], name, { type:'text/csv' }); }
function pdfFile(doc, name){ return new File([doc.output('blob')], name, { type:'application/pdf' }); }
function downloadFile(file){
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 10000);
}

function costReportFiles(){
  const p = state.fin.report;
  const r = costReportData(p);
  const admin = isAdmin();
  const stamp = localISODate(new Date());
  const base = `${fileSlug(r.title)}-${fileSlug(p.period==='monthly' ? `${p.year}-${String(p.month).padStart(2,'0')}` : p.period==='yearly' ? `${p.from}-to-${p.to}` : stamp)}${state.fin.vessel!=='all' || finScopeCompany() ? '-' + fileSlug(r.vesselLabel) : ''}`;

  const { doc, y } = newPdf(r.title, [
    `Period: ${r.periodLabel}`, `Vessels: ${r.vesselLabel}`, `Generated: ${fmtDate(stamp)}`,
    `Total: ${fmtCurrency(r.total)}   ·   ${r.rows.length} item${r.rows.length===1?'':'s'}`
  ]);
  const cols = [{label:'Date',w:19},{label:'Item',w:44},{label:'Category',w:26},{label:'Vessel',w:25},{label:'Provider',w:28},{label:'Status',w:21},{label:'Cost',w:19,align:'right'}];
  const body = r.rows.map(x=>[fmtDate(x.date), x.title + (x.description ? ` — ${x.description}` : ''), finCategoryLabel(x.category), x.vessel + (x.tender ? ` (${x.tender})` : ''), x.provider, x.status, fmtCurrency(x.cost)]);
  body.push([...cols.slice(0,-2).map(()=> ''), 'Total', fmtCurrency(r.total)]);
  let yy = pdfTable(doc, y, cols, body, { boldRows:[body.length-1] });
  const summary = (heading, entries)=>{
    yy += 6;
    if(yy > 255){ doc.addPage(); yy = 20; }
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text(heading, 14, yy); yy += 7;
    yy = pdfTable(doc, yy, [{label:heading.replace('By ','').replace(/^./, c=>c.toUpperCase()),w:120},{label:'Items',w:30,align:'right'},{label:'Cost',w:32,align:'right'}],
      entries.map(([n,v])=>[n, String(v.count), fmtCurrency(v.cost)]));
  };
  if(r.byCategory.length) summary('By category', r.byCategory);
  if(Object.keys(r.byVessel).length > 1) summary('By vessel', Object.entries(r.byVessel));
  pdfFooter(doc);

  const head = ['Date','Item','Details','Category','Source','Vessel','Tender','Service provider','Status', 'Cost (R)'];
  const csv = [
    head,
    ...r.rows.map(x=>[x.date, x.title, x.description, finCategoryLabel(x.category), x.source, x.vessel, x.tender, x.provider, x.status, Number(x.cost.toFixed(2))]),
    [...head.slice(0,-2).map(()=> ''), 'Total', Number(r.total.toFixed(2))]
  ];
  return {
    pdf: pdfFile(doc, base + '.pdf'),
    csv: csvFile(csv, base + '.csv'),
    subject: `${r.title} — ${r.periodLabel} — ${r.vesselLabel}`,
    text: `${r.title} for ${r.vesselLabel}, ${r.periodLabel}: ${fmtCurrency(r.total)} across ${r.rows.length} item${r.rows.length===1?'':'s'}. PDF and CSV attached.`
  };
}

function budgetFiles(){
  const b = state.fin.budget;
  const d = budgetData(b);
  const yearCols = d.baseYears.map(y=>budgetYearLabel(y, b.startMonth).split(' ')[0]);
  const base = `Budget-${fileSlug(d.yearLabel.split(' ')[0])}${state.fin.vessel!=='all' || finScopeCompany() ? '-' + fileSlug(d.vesselLabel) : ''}`;
  const { doc, y } = newPdf(`Budget ${d.yearLabel}`, [
    `Vessels: ${d.vesselLabel}`,
    `Based on: average spend ${d.baseLabel}, plus ${d.uplift}%`,
    `Budget: ${fmtCurrency(d.total.budget)}  (${fmtCurrency(d.total.monthly)} per month)${d.started ? `   ·   spent so far ${fmtCurrency(d.total.ytd)}, remaining ${fmtCurrency(d.total.remaining)}` : ''}`,
    `Generated: ${fmtDate(localISODate(new Date()))}`
  ]);
  const extra = d.started ? 2 : 0;
  const numW = Math.floor((182 - 44) / (yearCols.length + 3 + extra));
  const cols = [{label:'Category',w:182 - numW*(yearCols.length + 3 + extra)}, ...yearCols.map(l=>({label:l,w:numW,align:'right'})),
    {label:'Average',w:numW,align:'right'},{label:'Budget',w:numW,align:'right'},{label:'/month',w:numW,align:'right'},
    ...(d.started ? [{label:'Spent',w:numW,align:'right'},{label:'Remaining',w:numW,align:'right'}] : [])];
  const rowOf = r=>[r.label, ...r.actuals.map(fmtCurrency), fmtCurrency(r.average), fmtCurrency(r.budget), fmtCurrency(r.monthly), ...(d.started ? [fmtCurrency(r.ytd), fmtCurrency(r.remaining)] : [])];
  const body = [...d.categories.map(rowOf), rowOf({ ...d.total, label:'Total' })];
  let yy = pdfTable(doc, y, cols, body, { boldRows:[body.length-1] });
  if(d.vessels.length){
    yy += 6; if(yy > 255){ doc.addPage(); yy = 20; }
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('By vessel', 14, yy); yy += 7;
    pdfTable(doc, yy, [{ ...cols[0], label:'Vessel' }, ...cols.slice(1)], d.vessels.map(rowOf));
  }
  pdfFooter(doc);

  const head = ['Group','Name', ...yearCols.map(l=>`${l} actual (R)`), 'Average (R)', 'Budget (R)', 'Per month (R)', ...(d.started ? ['Spent so far (R)','Remaining (R)'] : [])];
  const num = v => v == null ? '' : Number(v.toFixed(2));
  const csvRow = (group, r)=>[group, r.label, ...r.actuals.map(num), num(r.average), num(r.budget), num(r.monthly), ...(d.started ? [num(r.ytd), num(r.remaining)] : [])];
  const csv = [
    ['Budget', d.yearLabel], ['Vessels', d.vesselLabel], ['Based on', `Average ${d.baseLabel} + ${d.uplift}%`], [],
    head,
    ...d.categories.map(r=>csvRow('Category', r)),
    csvRow('Total', { ...d.total, label:'All categories' }),
    ...d.vessels.map(r=>csvRow('Vessel', r))
  ];
  return {
    pdf: pdfFile(doc, base + '.pdf'),
    csv: csvFile(csv, base + '.csv'),
    subject: `Budget ${d.yearLabel} — ${d.vesselLabel}`,
    text: `Budget ${d.yearLabel} for ${d.vesselLabel}: ${fmtCurrency(d.total.budget)} (${fmtCurrency(d.total.monthly)} per month), based on average spend ${d.baseLabel} plus ${d.uplift}%. PDF and CSV attached.`
  };
}

/* Hands the files to the device's share sheet with them attached (most phones), copying
   the recipient so it can be pasted into the To field. Where files can't be shared
   (most desktop browsers) they download, and the mail app opens addressed to the
   recipient so they can be attached. Returns false if the person cancelled. */
async function emailFiles(files, to, subject, text, cc){
  if(navigator.canShare && navigator.canShare({ files })){
    if(to && navigator.clipboard) navigator.clipboard.writeText(to).catch(()=>{});
    try{ await navigator.share({ files, title:subject, text }); return true; }
    catch(e){ if(e && e.name === 'AbortError') return false; /* otherwise fall through to download */ }
  }
  files.forEach(downloadFile);
  window.location.href = mailtoLink(to, cc || '', subject, `${text}\n\n(${files.map(f=>f.name).join(' and ')} downloaded to this device — please attach before sending.)`);
  return true;
}

async function finFileAction(action, kind){
  if(kind === 'report' && !state.fin.report) return;
  if(kind !== 'report' && kind !== 'budget') return;
  let out;
  try{ out = kind === 'budget' ? budgetFiles() : costReportFiles(); }
  catch(e){ alert('Could not build the files. ' + (e && e.message ? e.message : '')); return; }
  if(action === 'fin-pdf'){ downloadFile(out.pdf); return; }
  if(action === 'fin-csv'){ downloadFile(out.csv); return; }

  const to = state.fin.emailTo;
  if(!to){
    const box = document.getElementById('finEmailTo');
    alert(`Enter the email address to send this ${kind === 'budget' ? 'budget' : 'report'} to.`);
    if(box) box.focus();
    return;
  }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)){ alert('That email address doesn\'t look right.'); return; }
  await emailFiles([out.pdf, out.csv], to, out.subject, out.text);
}

/* Options for the equipment a maintenance task is for: the vessel's hour meters (engines,
   other equipment and tender engines from its vessel details), or the vessel as a whole. */
const METER_GROUPS = [ { kind:'engine', label:'Engines' }, { kind:'equipment', label:'Other equipment' }, { kind:'tender', label:'Tender engines' } ];
function maintMeterOptions(vesselId, selectedId, savedLabel){
  const meters = vesselHourMeters(state.vessels.find(v=>v.id===vesselId));
  const opt = m => `<option value="${esc(m.id)}" ${m.id===selectedId?'selected':''}>${esc([m.label, m.model].filter(Boolean).join(' — '))} (${m.hours.toLocaleString()} hrs)</option>`;
  const missing = selectedId && !meters.some(m=>m.id===selectedId)
    ? `<option value="${esc(selectedId)}" data-label="${esc(savedLabel||'')}" selected>${esc(savedLabel || 'Equipment')} (no longer on vessel)</option>` : '';
  return `<option value="">Whole vessel / general</option>${missing}`
    + METER_GROUPS.map(g=>{ const ms = meters.filter(m=>m.kind===g.kind); return ms.length ? `<optgroup label="${g.label}">${ms.map(opt).join('')}</optgroup>` : ''; }).join('');
}
function maintMeterLabel(vesselId, meterId){
  const m = vesselHourMeters(state.vessels.find(v=>v.id===vesselId)).find(x=>x.id===meterId);

}

    )}
    <label class="field">Hours at that date<input name="svcFromHours" type="number" min="0" step="0.1" value="${en.scheduleFrom ? (Number(en.scheduleFromHours)||0) : ''}" placeholder="0"></label>
    <div class="cl-hint" style="font-size:12px; margin:-4px 0 10px;">The handover or last full service. Each task counts from here until it's first marked completed under Maintenance → Service schedules. Leave the date blank to use today.</div>`;
}
function serviceScheduleData(fd, existing){
  const schedule = fd.get('svcSchedule') || '';
  if(!schedule) return { schedule:'' };
  return { schedule, scheduleFrom: fd.get('svcFrom') || (existing && existing.scheduleFrom) || localISODate(new Date()), scheduleFromHours: Number(fd.get('svcFromHours'))||0 };
}

/* Creates an owner's Firebase Auth account without signing the admin out: a second,
   throwaway Firebase app instance does the sign-up and is signed straight back out. */
async function createOwnerAccount(email, password){
  const app = firebase.apps.find(a=>a.name==='owner-setup') || firebase.initializeApp(FIREBASE_CONFIG, 'owner-setup');
  const auth = app.auth();
  await auth.setPersistence(firebase.auth.Auth.Persistence.NONE);
  const cred = await auth.createUserWithEmailAndPassword(email, password);
  const uid = cred.user.uid;
  await auth.signOut();
  return uid;
}

function renderModal(){
  const root = document.getElementById('modalRoot');
  const modal = state.modal;
  if(!modal){ root.innerHTML=''; return; }
  let title = '', body = '';
  const cancelBtn = `<button type="button" class="btn ghost" data-action="close-modal">Cancel</button>`;
  const saveBtn = `<button type="submit" class="btn primary">Save</button>`;

  if(modal.type==='view-vessel'){
    root.innerHTML = `<div class="modal-overlay" data-action="overlay-close"><div class="modal" onclick="event.stopPropagation()">${renderVesselDetail(modal.id)}</div></div>`;
    attachModalEvents();
    return;
  }
  if(modal.type==='invoice-scan'){
    root.innerHTML = `<div class="modal-overlay" data-action="overlay-close"><div class="modal" onclick="event.stopPropagation()">${renderInvoiceScan(modal)}</div></div>`;
    attachModalEvents();
    wireInvoiceScan();
    return;
  }
  if(modal.type==='view-tender'){
    root.innerHTML = `<div class="modal-overlay" data-action="overlay-close"><div class="modal" onclick="event.stopPropagation()">${renderTenderDetail(modal.vesselId, modal.tenderId)}</div></div>`;
    attachModalEvents();
    return;
  }
  if(modal.type==='vessel'){ title = modal.data ? 'Edit vessel' : 'Add vessel'; body = vesselForm(modal.data); }
  else if(modal.type==='maintenance'){ title = modal.data ? 'Edit maintenance task' : 'Add maintenance task'; body = maintenanceForm(modal.data); }
  else if(modal.type==='crew'){ title = modal.data ? 'Edit crew member' : 'Add crew member'; body = crewForm(modal.data); }
  else if(modal.type==='qual'){ title = modal.data ? 'Edit qualification' : 'Add qualification'; body = qualForm(modal.data); }
  else if(modal.type==='vessel-cost'){ title = 'Add fixed cost'; body = vesselCostForm(); }
  else if(modal.type==='vessel-engine'){ const eq = modal.list==='equipment'; title = (modal.data ? 'Edit ' : 'Add ') + (eq ? 'equipment' : 'engine'); body = vesselEngineForm(modal.data, modal.list); }
  else if(modal.type==='vessel-doc'){ title = 'Add vessel document'; body = documentForm({ expiry:true }); }
  else if(modal.type==='doc-expiry'){ title = 'Document expiry date'; body = `<p style="margin-top:0;"><b>${esc(modal.data.name)}</b></p><label class="field">Expiry date${dateField('docExpiry', modal.data.expiry||'')}</label><div class="cl-hint" style="font-size:12px; margin:-4px 0 10px;">Clear the date if this document doesn't expire.</div>`; }
  else if(modal.type==='crew-doc'){ title = 'Add crew document'; body = documentForm(); }
  else if(modal.type==='tender'){ title = modal.data ? 'Edit tender' : 'Add tender'; body = tenderForm(modal.data); }
  else if(modal.type==='tender-engine'){ title = modal.data ? 'Edit engine' : 'Add engine'; body = vesselEngineForm(modal.data); }
  else if(modal.type==='tender-task'){ title = modal.data ? 'Edit task' : 'Add task'; body = tenderMaintenanceForm(modal.data); }
  else if(modal.type==='tender-doc'){ title = 'Add tender document'; body = documentForm({ expiry:true }); }
  else if(modal.type==='company'){ title = modal.data ? 'Edit company' : 'Add company'; body = companyForm(modal.data); }
  else if(modal.type==='checklist'){ title = modal.data ? 'Edit checklist' : 'New checklist'; body = checklistForm(modal.data); }
  else if(modal.type==='checklist-import'){ title = 'Import standard checklists'; body = checklistImportForm(); }
  else if(modal.type==='finance-item'){ title = modal.data ? 'Edit cost' : 'Add cost'; body = financeItemForm(modal.data); }

  root.innerHTML = `
    <div class="modal-overlay" data-action="overlay-close">
      <div class="modal" onclick="event.stopPropagation()">
        <form id="modalForm">
          <h3>${title}</h3>
          ${body}
          <div class="modal-actions">${cancelBtn}${saveBtn}</div>
        </form>
      </div>
    </div>
  `;
  attachModalEvents();
}

function attachModalEvents(){
  const overlay = document.querySelector('.modal-overlay');
  if(overlay){
    overlay.addEventListener('click', ()=>{ state.modal=null; render(); });
  }
  document.querySelectorAll('[data-action="close-modal"]').forEach(b=>b.addEventListener('click', (e)=>{ e.preventDefault(); state.modal=null; render(); }));
  document.querySelectorAll('[data-action="view-doc"]').forEach(b=>b.addEventListener('click', (e)=>{ e.preventDefault(); openDocument(b.dataset); }));
  const form = document.getElementById('modalForm');
  if(form) form.addEventListener('submit', handleFormSubmit);
  wireChecklistItemEditor();
  wireCrewQualAdder();
  wireFinanceItemForm();
  const formVessel = form && form.elements.vesselId;
  const meterSelect = form && form.querySelector('[data-meter-select]');
  const dueHoursField = form && form.querySelector('[data-due-hours-field]');
  const syncDueHours = ()=>{ if(!dueHoursField) return; const on = !!meterSelect.value; dueHoursField.style.display = on ? '' : 'none'; dueHoursField.querySelector('input').disabled = !on; };
  if(meterSelect && formVessel) formVessel.addEventListener('change', ()=>{ meterSelect.innerHTML = maintMeterOptions(formVessel.value, ''); syncDueHours(); });
  if(meterSelect) meterSelect.addEventListener('change', syncDueHours);
  const photoInput = document.getElementById('vesselPhotoInput');
  if(photoInput){
    photoInput.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        const dataUrl = await resizeImageFile(file, 480, 0.6);
        document.getElementById('vesselPhotoHidden').value = dataUrl;
        document.getElementById('vesselPhotoPreview').innerHTML = `<img src="${dataUrl}" style="max-width:200px; max-height:140px; border-radius:6px; display:block;">`;
      }catch(err){
        alert("Couldn't process that photo. Try a different file.");
      }
    });
  }
  const removePhotoBtn = document.getElementById('removeVesselPhoto');
  if(removePhotoBtn){
    removePhotoBtn.addEventListener('click', ()=>{
      document.getElementById('vesselPhotoHidden').value = '';
      document.getElementById('vesselPhotoPreview').innerHTML = '';
      removePhotoBtn.remove();
    });
  }
  const docInput = document.getElementById('docFileInput');
  if(docInput){
    docInput.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const preview = document.getElementById('docPreview');
      preview.textContent = 'Processing…';
      try{
        const dataUrl = await processDocumentFile(file);
        document.getElementById('docDataHidden').value = dataUrl;
        document.getElementById('docFileNameHidden').value = file.name;
        const sizeKb = Math.round(dataUrl.length * 0.75 / 1024);
        preview.textContent = `${file.name} (${sizeKb} KB) ready to save.`;
      }catch(err){
        document.getElementById('docDataHidden').value = '';
        preview.textContent = '';
        alert(err.message || "Couldn't process that file.");
      }
    });
  }
  document.querySelectorAll('[data-action="edit-vessel"]').forEach(b=>b.addEventListener('click', ()=>{
    const v = state.vessels.find(x=>x.id===b.dataset.id);
    state.modal = { type:'vessel', data:v };
    renderModal();
  }));
  document.querySelectorAll('[data-action="delete-vessel"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(confirm('Delete this vessel? Related maintenance and crew assignment records will remain but show as unassigned.')){
      const vesselId = b.dataset.id;
      state.modal = null;
      const gone = state.allVessels.find(x=>x.id===vesselId) || {};
      removeDocFiles([...(gone.documents||[]), ...(gone.tenders||[]).flatMap(t=>t.documents||[])]);
      await persistArray('vessels', fresh => fresh.filter(x=>x.id!==vesselId));
      render();
    }
  }));
  document.querySelectorAll('[data-action="add-vessel-cost"]').forEach(b=>b.addEventListener('click', ()=>{
    state.modal = { type:'vessel-cost', id:b.dataset.id };
    renderModal();
  }));
  document.querySelectorAll('[data-action="delete-vessel-cost"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Remove this fixed cost?')) return;
    const vesselId = b.dataset.id, costId = b.dataset.costId;
    state.modal = { type:'view-vessel', id:vesselId };
    await persistArray('vessels', fresh => fresh.map(v=> v.id===vesselId ? { ...v, fixedCosts:(v.fixedCosts||[]).filter(c=>c.id!==costId) } : v));
    render();
  }));
  /* engines and other hour-meter equipment share one form; data-list picks the list */
  document.querySelectorAll('[data-action="add-vessel-engine"]').forEach(b=>b.addEventListener('click', ()=>{
    state.modal = { type:'vessel-engine', id:b.dataset.id, list:b.dataset.list || 'engines', data:null };
    renderModal();
  }));
  document.querySelectorAll('[data-action="edit-vessel-engine"]').forEach(b=>b.addEventListener('click', ()=>{
    const list = b.dataset.list || 'engines';
    const v = state.vessels.find(x=>x.id===b.dataset.id);
    const engine = v ? (v[list]||[]).find(en=>en.id===b.dataset.engineId) : null;
    state.modal = { type:'vessel-engine', id:b.dataset.id, list, data:engine };
    renderModal();
  }));
  document.querySelectorAll('[data-action="delete-vessel-engine"]').forEach(b=>b.addEventListener('click', async ()=>{
    const list = b.dataset.list || 'engines';
    if(!confirm(list==='equipment' ? 'Remove this equipment record?' : 'Remove this engine record?')) return;
    const vesselId = b.dataset.id, engineId = b.dataset.engineId;
    state.modal = { type:'view-vessel', id:vesselId };
    await persistArray('vessels', fresh => fresh.map(v=> v.id===vesselId ? { ...v, [list]:(v[list]||[]).filter(en=>en.id!==engineId) } : v));
    render();
  }));
  document.querySelectorAll('[data-action="doc-expiry"]').forEach(b=>b.addEventListener('click', ()=>{
    const v = state.vessels.find(x=>x.id===b.dataset.id);
    const t = b.dataset.tenderId ? ((v && v.tenders) || []).find(x=>x.id===b.dataset.tenderId) : null;
    const doc = ((b.dataset.tenderId ? t && t.documents : v && v.documents) || []).find(d=>d.id===b.dataset.docId);
    if(!doc) return;
    state.modal = { type:'doc-expiry', vesselId:b.dataset.id, tenderId:b.dataset.tenderId || null, data:doc };
    renderModal();
  }));
  document.querySelectorAll('[data-action="add-vessel-doc"]').forEach(b=>b.addEventListener('click', ()=>{
    state.modal = { type:'vessel-doc', id:b.dataset.id };
    renderModal();
  }));
  document.querySelectorAll('[data-action="delete-vessel-doc"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Remove this document? This cannot be undone.')) return;
    const vesselId = b.dataset.id, docId = b.dataset.docId;
    state.modal = { type:'view-vessel', id:vesselId };
    removeDocFiles([{ id:docId }]);
    await persistArray('vessels', fresh => fresh.map(v=> v.id===vesselId ? { ...v, documents:(v.documents||[]).filter(d=>d.id!==docId) } : v));
    render();
  }));
  document.querySelectorAll('[data-action="add-tender"]').forEach(b=>b.addEventListener('click', ()=>{
    state.modal = { type:'tender', vesselId:b.dataset.id, data:null };
    renderModal();
  }));
  document.querySelectorAll('[data-action="view-tender"]').forEach(b=>b.addEventListener('click', ()=>{
    state.modal = { type:'view-tender', vesselId:b.dataset.id, tenderId:b.dataset.tenderId };
    renderModal();
  }));
  document.querySelectorAll('[data-action="edit-tender"]').forEach(b=>b.addEventListener('click', ()=>{
    const v = state.vessels.find(x=>x.id===b.dataset.id);
    const t = v ? (v.tenders||[]).find(tt=>tt.id===b.dataset.tenderId) : null;
    state.modal = { type:'tender', vesselId:b.dataset.id, data:t };
    renderModal();
  }));
  document.querySelectorAll('[data-action="delete-tender"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Delete this tender and all its records? This cannot be undone.')) return;
    const vesselId = b.dataset.id, tenderId = b.dataset.tenderId;
    state.modal = { type:'view-vessel', id:vesselId };
    const v = state.allVessels.find(x=>x.id===vesselId);
    removeDocFiles(((v && v.tenders || []).find(t=>t.id===tenderId) || {}).documents);
    await persistArray('vessels', fresh => fresh.map(v=> v.id===vesselId ? { ...v, tenders:(v.tenders||[]).filter(t=>t.id!==tenderId) } : v));
    render();
  }));
  document.querySelectorAll('[data-action="back-to-vessel"]').forEach(b=>b.addEventListener('click', ()=>{
    state.modal = { type:'view-vessel', id:b.dataset.id };
    renderModal();
  }));
  document.querySelectorAll('[data-action="add-tender-engine"]').forEach(b=>b.addEventListener('click', ()=>{
    state.modal = { type:'tender-engine', vesselId:b.dataset.id, tenderId:b.dataset.tenderId, data:null };
    renderModal();
  }));
  document.querySelectorAll('[data-action="edit-tender-engine"]').forEach(b=>b.addEventListener('click', ()=>{
    const v = state.vessels.find(x=>x.id===b.dataset.id);
    const t = v ? (v.tenders||[]).find(tt=>tt.id===b.dataset.tenderId) : null;
    const engine = t ? (t.engines||[]).find(en=>en.id===b.dataset.engineId) : null;
    state.modal = { type:'tender-engine', vesselId:b.dataset.id, tenderId:b.dataset.tenderId, data:engine };
    renderModal();
  }));
  document.querySelectorAll('[data-action="delete-tender-engine"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Remove this engine record?')) return;
    const vesselId = b.dataset.id, tenderId = b.dataset.tenderId, engineId = b.dataset.engineId;
    state.modal = { type:'view-tender', vesselId, tenderId };
    await persistArray('vessels', fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const tenders = (v.tenders||[]).map(t=> t.id===tenderId ? { ...t, engines:(t.engines||[]).filter(en=>en.id!==engineId) } : t);
      return { ...v, tenders };
    }));
    render();
  }));
  document.querySelectorAll('[data-action="add-tender-task"]').forEach(b=>b.addEventListener('click', ()=>{
    state.modal = { type:'tender-task', vesselId:b.dataset.id, tenderId:b.dataset.tenderId, data:null };
    renderModal();
  }));
  document.querySelectorAll('[data-action="edit-tender-task"]').forEach(b=>b.addEventListener('click', ()=>{
    const v = state.vessels.find(x=>x.id===b.dataset.id);
    const t = v ? (v.tenders||[]).find(tt=>tt.id===b.dataset.tenderId) : null;
    const task = t ? (t.maintenance||[]).find(m=>m.id===b.dataset.taskId) : null;
    state.modal = { type:'tender-task', vesselId:b.dataset.id, tenderId:b.dataset.tenderId, data:task };
    renderModal();
  }));
  document.querySelectorAll('[data-action="complete-tender-task"]').forEach(b=>b.addEventListener('click', async ()=>{
    const vesselId = b.dataset.id, tenderId = b.dataset.tenderId, taskId = b.dataset.taskId;
    state.modal = { type:'view-tender', vesselId, tenderId };
    await persistArray('vessels', fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const tenders = (v.tenders||[]).map(t=>{
        if(t.id!==tenderId) return t;
        const tasks = (t.maintenance||[]).map(m=> m.id===taskId ? { ...m, status:'completed', completedDate:new Date().toISOString().slice(0,10) } : m);
        return { ...t, maintenance: tasks };
      });
      return { ...v, tenders };
    }));
    render();
  }));
  document.querySelectorAll('[data-action="delete-tender-task"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Delete this maintenance task?')) return;
    const vesselId = b.dataset.id, tenderId = b.dataset.tenderId, taskId = b.dataset.taskId;
    state.modal = { type:'view-tender', vesselId, tenderId };
    await persistArray('vessels', fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const tenders = (v.tenders||[]).map(t=> t.id===tenderId ? { ...t, maintenance:(t.maintenance||[]).filter(m=>m.id!==taskId) } : t);
      return { ...v, tenders };
    }));
    render();
  }));
  document.querySelectorAll('[data-action="add-tender-doc"]').forEach(b=>b.addEventListener('click', ()=>{
    state.modal = { type:'tender-doc', vesselId:b.dataset.id, tenderId:b.dataset.tenderId };
    renderModal();
  }));
  document.querySelectorAll('[data-action="delete-tender-doc"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Remove this document? This cannot be undone.')) return;
    const vesselId = b.dataset.id, tenderId = b.dataset.tenderId, docId = b.dataset.docId;
    state.modal = { type:'view-tender', vesselId, tenderId };
    removeDocFiles([{ id:docId }]);
    await persistArray('vessels', fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const tenders = (v.tenders||[]).map(t=> t.id===tenderId ? { ...t, documents:(t.documents||[]).filter(d=>d.id!==docId) } : t);
      return { ...v, tenders };
    }));
    render();
  }));
  document.querySelectorAll('[data-action="company-reset-password"]').forEach(b=>b.addEventListener('click', async ()=>{
    try{
      await firebase.auth().sendPasswordResetEmail(b.dataset.email);
      alert(`Password reset email sent to ${b.dataset.email}.`);
    }catch(err){ alert("Couldn't send the reset email: " + authErrorText(err)); }
  }));
  document.querySelectorAll('[data-action="company-remove-login"]').forEach(b=>b.addEventListener('click', async ()=>{
    const co = state.companies.find(c=>c.id===b.dataset.id);
    if(!co || !confirm(`Remove ${co.loginEmail}'s login? They will no longer be able to sign in. You can then create a new login with a different email.`)) return;
    try{ await firebase.database().ref('oceanhub/users/' + co.loginUid).remove(); }
    catch(err){ alert("Couldn't remove the login: " + (err && err.message || err)); return; }
    await persistArray('companies', fresh => fresh.map(c=> c.id===co.id ? { ...c, loginEmail:'', loginUid:'' } : c));
    state.modal = { type:'company', data: state.companies.find(c=>c.id===co.id) };
    render();
  }));
  /* Scoped to .modal because reveal-password also appears in the (already-bound)
     companies list rows — an unscoped query here would double-bind those. */
  const modalEl = document.querySelector('.modal');
  if(modalEl){
    modalEl.querySelectorAll('[data-action="reveal-password"]').forEach(b=>b.addEventListener('click', ()=>{
      const span = b.previousElementSibling;
      if(span && span.classList.contains('pw-mask')){
        const shown = span.dataset.shown === '1';
        span.textContent = shown ? '••••••••' : (span.dataset.pw || '');
        span.dataset.shown = shown ? '0' : '1';
        b.textContent = shown ? 'Show' : 'Hide';
      }
    }));
  }
}

async function handleFormSubmit(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const modal = state.modal;
  let targetKey = null, mutateFn = null, nextModal = null;

  if(modal.type==='vessel'){
    const data = { name:fd.get('name'), type:fd.get('type'), reg:fd.get('reg'), status:fd.get('status'), engineHours:Number(fd.get('engineHours'))||0, notes:fd.get('notes')||'', photo:fd.get('photo')||'', ownerName:fd.get('ownerName')||'', ownerPhone:fd.get('ownerPhone')||'', ownerEmail:fd.get('ownerEmail')||'' };
    const editId = modal.data ? modal.data.id : null;
    targetKey = 'vessels';
    mutateFn = fresh => editId
      ? fresh.map(v=> v.id===editId ? { ...v, ...data } : v)
      : [...fresh, { id:uid('v'), fixedCosts:[], documents:[], engines:[], ...data }];
  }
  else if(modal.type==='maintenance'){
    const meterId = fd.get('meterId') || '';
    const data = { vesselId:fd.get('vesselId'), meterId, meterLabel: meterId ? (maintMeterLabel(fd.get('vesselId'), meterId) || (modal.data && modal.data.meterLabel) || '') : '',
      dueHours: meterId && Number(fd.get('dueHours')) > 0 ? Math.round(Number(fd.get('dueHours')) * 10) / 10 : null, category:fd.get('category'), title:fd.get('title'), description:fd.get('description')||'', dueDate:fd.get('dueDate'), priority:fd.get('priority') };
    const editId = modal.data ? modal.data.id : null;
    targetKey = 'maintenance';
    mutateFn = fresh => editId
      ? fresh.map(m=> m.id===editId ? { ...m, ...data } : m)
      : [...fresh, { id:uid('m'), status:'upcoming', ...data }];
  }
  else if(modal.type==='crew'){
    const data = { name:fd.get('name'), role:fd.get('role'), vesselId:fd.get('vesselId'), email:fd.get('email')||'', phone:fd.get('phone')||'' };
    const editId = modal.data ? modal.data.id : null;
    const quals = [];
    for(let i=0; fd.has('tqName_' + i); i++){
      const expiry = fd.get('tqExpiry_' + i);
      if(expiry) quals.push({ id:uid('q'), name:fd.get('tqName_' + i), expiry });
    }
    const xqNames = fd.getAll('xqName'), xqExpiries = fd.getAll('xqExpiry');
    xqNames.forEach((n,i)=>{
      const name = String(n||'').trim();
      if(name && xqExpiries[i]) quals.push({ id:uid('q'), name, expiry:xqExpiries[i] });
    });
    targetKey = 'crew';
    mutateFn = fresh => editId
      ? fresh.map(c=> c.id===editId ? { ...c, ...data } : c)
      : [...fresh, { id:uid('c'), quals, documents:[], ...data }];
  }
  else if(modal.type==='qual'){
    const data = { name:fd.get('name'), expiry:fd.get('expiry') };
    const crewId = modal.id;
    const editQualId = modal.data ? modal.data.id : null;
    targetKey = 'crew';
    mutateFn = fresh => fresh.map(c=>{
      if(c.id!==crewId) return c;
      const quals = c.quals || [];
      const newQuals = editQualId
        ? quals.map(q=> q.id===editQualId ? { ...q, ...data } : q)
        : [...quals, { id:uid('q'), ...data }];
      return { ...c, quals: newQuals };
    });
  }
  else if(modal.type==='vessel-cost'){
    const data = { label:fd.get('label'), amount:Number(fd.get('amount'))||0, frequency:fd.get('frequency') };
    const vesselId = modal.id;
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=> v.id===vesselId ? { ...v, fixedCosts:[...(v.fixedCosts||[]), { id:uid('fc'), ...data }] } : v);
    nextModal = { type:'view-vessel', id: vesselId };
  }
  else if(modal.type==='vessel-engine'){
    const list = modal.list === 'equipment' ? 'equipment' : 'engines';
    const data = { label:fd.get('engineLabel')||'', type:fd.get('engineType'), serial:fd.get('engineSerial')||'', hours:Number(fd.get('engineHrs'))||0 };
    if(list === 'equipment') data.specs = fd.get('engineSpecs')||'';
    Object.assign(data, serviceScheduleData(fd, modal.data));
    const vesselId = modal.id;
    const editEngineId = modal.data ? modal.data.id : null;
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const items = v[list] || [];
      const newItems = editEngineId
        ? items.map(en=> en.id===editEngineId ? { ...en, ...data } : en)
        : [...items, { id:uid(list==='equipment' ? 'eq' : 'en'), ...data }];
      return { ...v, [list]: newItems };
    });
    nextModal = { type:'view-vessel', id: vesselId };
  }
  else if(modal.type==='vessel-doc'){
    const dataUrl = fd.get('docData');
    if(!dataUrl){ alert('Please choose a file first.'); return; }
    const vesselId = modal.id;
    const docData = { id:uid('doc'), name:fd.get('docName'), fileName:fd.get('docFileName')||'', addedDate:new Date().toISOString().slice(0,10), expiry:fd.get('docExpiry')||'' };
    try{ await storeDocFile(docData.id, dataUrl); }
    catch(err){ alert("Couldn't upload the document — check your connection and try again."); return; }
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=> v.id===vesselId ? { ...v, documents:[...(v.documents||[]), docData] } : v);
    nextModal = { type:'view-vessel', id: vesselId };
  }
  else if(modal.type==='crew-doc'){
    const dataUrl = fd.get('docData');
    if(!dataUrl){ alert('Please choose a file first.'); return; }
    const crewId = modal.id;
    const docData = { id:uid('doc'), name:fd.get('docName'), fileName:fd.get('docFileName')||'', addedDate:new Date().toISOString().slice(0,10) };
    try{ await storeDocFile(docData.id, dataUrl); }
    catch(err){ alert("Couldn't upload the document — check your connection and try again."); return; }
    targetKey = 'crew';
    mutateFn = fresh => fresh.map(c=> c.id===crewId ? { ...c, documents:[...(c.documents||[]), docData] } : c);
  }
  else if(modal.type==='tender'){
    const data = { name:fd.get('tenderName'), type:fd.get('tenderType')||'', reg:fd.get('tenderReg')||'' };
    const vesselId = modal.vesselId;
    const editId = modal.data ? modal.data.id : null;
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const tenders = v.tenders || [];
      const newTenders = editId
        ? tenders.map(t=> t.id===editId ? { ...t, ...data } : t)
        : [...tenders, { id:uid('tn'), engines:[], documents:[], maintenance:[], ...data }];
      return { ...v, tenders: newTenders };
    });
    nextModal = editId ? { type:'view-tender', vesselId, tenderId: editId } : { type:'view-vessel', id: vesselId };
  }
  else if(modal.type==='tender-engine'){
    const data = { label:fd.get('engineLabel')||'', type:fd.get('engineType'), serial:fd.get('engineSerial'), hours:Number(fd.get('engineHrs'))||0, ...serviceScheduleData(fd, modal.data) };
    const vesselId = modal.vesselId, tenderId = modal.tenderId;
    const editEngineId = modal.data ? modal.data.id : null;
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const tenders = (v.tenders||[]).map(t=>{
        if(t.id!==tenderId) return t;
        const engines = t.engines || [];
        const newEngines = editEngineId
          ? engines.map(en=> en.id===editEngineId ? { ...en, ...data } : en)
          : [...engines, { id:uid('en'), ...data }];
        return { ...t, engines: newEngines };
      });
      return { ...v, tenders };
    });
    nextModal = { type:'view-tender', vesselId, tenderId };
  }
  else if(modal.type==='tender-task'){
    const data = { title:fd.get('title'), description:fd.get('description')||'', category:fd.get('category'), dueDate:fd.get('dueDate'), priority:fd.get('priority') };
    const vesselId = modal.vesselId, tenderId = modal.tenderId;
    const editTaskId = modal.data ? modal.data.id : null;
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const tenders = (v.tenders||[]).map(t=>{
        if(t.id!==tenderId) return t;
        const tasks = t.maintenance || [];
        const newTasks = editTaskId
          ? tasks.map(m=> m.id===editTaskId ? { ...m, ...data } : m)
          : [...tasks, { id:uid('tm'), status:'upcoming', ...data }];
        return { ...t, maintenance: newTasks };
      });
      return { ...v, tenders };
    });
    nextModal = { type:'view-tender', vesselId, tenderId };
  }
  else if(modal.type==='doc-expiry'){
    const expiry = fd.get('docExpiry') || '';
    const { vesselId, tenderId } = modal, docId = modal.data.id;
    const setExp = docs => (docs||[]).map(d=> d.id===docId ? { ...d, expiry } : d);
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=> v.id!==vesselId ? v : tenderId
      ? { ...v, tenders:(v.tenders||[]).map(t=> t.id===tenderId ? { ...t, documents:setExp(t.documents) } : t) }
      : { ...v, documents:setExp(v.documents) });
    nextModal = tenderId ? { type:'view-tender', vesselId, tenderId } : { type:'view-vessel', id:vesselId };
  }
  else if(modal.type==='tender-doc'){
    const dataUrl = fd.get('docData');
    if(!dataUrl){ alert('Please choose a file first.'); return; }
    const vesselId = modal.vesselId, tenderId = modal.tenderId;
    const docData = { id:uid('doc'), name:fd.get('docName'), fileName:fd.get('docFileName')||'', addedDate:new Date().toISOString().slice(0,10), expiry:fd.get('docExpiry')||'' };
    try{ await storeDocFile(docData.id, dataUrl); }
    catch(err){ alert("Couldn't upload the document — check your connection and try again."); return; }
    targetKey = 'vessels';
    mutateFn = fresh => fresh.map(v=>{
      if(v.id!==vesselId) return v;
      const tenders = (v.tenders||[]).map(t=> t.id===tenderId ? { ...t, documents:[...(t.documents||[]), docData] } : t);
      return { ...v, tenders };
    });
    nextModal = { type:'view-tender', vesselId, tenderId };
  }
  else if(modal.type==='company'){
    const editId = modal.data ? modal.data.id : null;
    const coId = editId || uid('co');
    const data = {
      name:fd.get('name'), contactName:fd.get('contactName')||'', contactEmail:fd.get('contactEmail')||'',
      contactPhone:fd.get('contactPhone')||'', address:fd.get('address')||'', notes:fd.get('notes')||'',
      vesselIds:fd.getAll('vesselIds')
    };
    const loginEmail = String(fd.get('loginEmail')||'').trim().toLowerCase();
    const pw = String(fd.get('loginPassword')||'');
    const prevLogin = modal.data && modal.data.loginUid ? modal.data : null;
    const emailChanged = !!loginEmail && (!prevLogin || loginEmail !== (prevLogin.loginEmail||'').toLowerCase());
    if(emailChanged && state.companies.some(c => c.id !== editId && (c.loginEmail||'').toLowerCase() === loginEmail)){
      alert('Another company already signs in with that email.'); return;
    }
    let login = null;
    if(prevLogin && (emailChanged || pw)){
      /* editing someone else's account needs the Admin SDK, so it goes through the Cloud Function */
      if(pw && pw.length < 6){ alert('The new password needs at least 6 characters.'); return; }
      try{
        await firebase.functions().httpsCallable('updateOwnerLogin')({
          uid:prevLogin.loginUid, ...(emailChanged ? { email:loginEmail } : {}), ...(pw ? { password:pw } : {})
        });
      }catch(err){
        /* an undeployed function shows up as a CORS failure, reported as 'internal' */
        alert(err && err.code === 'functions/internal'
          ? "Couldn't reach the login service — has the Cloud Function been deployed? (see functions/ in the project)"
          : "Couldn't update the login: " + ((err && err.message) || err));
        return;
      }
      if(emailChanged) login = { loginEmail, loginUid:prevLogin.loginUid };
    }
    else if(emailChanged){
      if(pw.length < 6){ alert('The starting password needs at least 6 characters.'); return; }
      try{
        const loginUid = await createOwnerAccount(loginEmail, pw);
        await firebase.database().ref('oceanhub/users/' + loginUid).set({ role:'owner', companyId:coId, email:loginEmail });
        login = { loginEmail, loginUid };
      }catch(err){
        alert(err && err.code === 'auth/email-already-in-use'
          ? `${loginEmail} already has an OCEANHUB account. Use a different email, or delete that user in the Firebase console (Authentication > Users) and try again.`
          : "Couldn't create the owner login: " + authErrorText(err));
        return;
      }
    }
    const merge = c => ({ ...c, ...data, ...(login || {}) });
    targetKey = 'companies';
    mutateFn = fresh => editId
      ? fresh.map(c=> c.id===editId ? merge(c) : c)
      : [...fresh, merge({ id:coId })];
  }
  else if(modal.type==='checklist'){
    const labels = fd.getAll('itemLabel'), types = fd.getAll('itemType'), units = fd.getAll('itemUnit'), pars = fd.getAll('itemPar'), mins = fd.getAll('itemMin'), ids = fd.getAll('itemId');
    const items = labels.map((label, i)=>{
      const type = types[i]==='stock' || types[i]==='heading' ? types[i] : 'task';
      const stock = type==='stock';
      return { id: ids[i] || uid('ci'), label: String(label).trim(), type,
        unit: stock ? String(units[i]||'').trim() : '',
        par: stock && pars[i]!=='' ? Number(pars[i])||0 : '',
        min: stock && mins[i]!=='' ? Number(mins[i])||0 : '' };
    }).filter(it => it.label);
    const allVessels = fd.get('allVessels') === '1';
    const vesselIds = allVessels ? [] : fd.getAll('vesselIds');
    if(!items.some(it=>it.type!=='heading')){ alert('Add at least one task or stock item.'); return; }
    if(!allVessels && vesselIds.length === 0){ alert('Choose at least one vessel, or tick "All vessels".'); return; }
    const data = { name:fd.get('name'), frequency:fd.get('frequency'), description:fd.get('description')||'', emailTo:String(fd.get('emailTo')||'').trim(), allVessels, vesselIds, items };
    const editId = modal.data ? modal.data.id : null;
    targetKey = 'checklists';
    mutateFn = fresh => editId
      ? fresh.map(c=> c.id===editId ? { ...c, ...data } : c)
      : [...fresh, { id:uid('cl'), createdDate:localISODate(new Date()), ...data }];
  }
  else if(modal.type==='finance-item'){
    const cost = Number(fd.get('cost'));
    if(!fd.get('date')){ alert('Enter the date as dd/mm/yyyy.'); return; }
    if(!(cost >= 0)){ alert('Enter the cost.'); return; }
    const t = k => String(fd.get(k)||'').trim();
    const data = { vesselId:fd.get('vesselId'), category:fd.get('category'), description:t('description'), date:fd.get('date'),
      cost: Math.round(cost*100)/100, invoiceRef:t('invoiceRef'), notes:t('notes'),
      provider:{ name:t('providerName'), contactName:t('providerContact'), phone:t('providerPhone'), email:t('providerEmail') } };
    const editId = modal.data ? modal.data.id : null;
    targetKey = 'financeItems';
    mutateFn = fresh => editId
      ? fresh.map(x=> x.id===editId ? { ...x, ...data } : x)
      : [...fresh, { id:uid('fi'), createdBy: session ? session.email : '', createdDate: localISODate(new Date()), ...data }];
  }
  else if(modal.type==='checklist-import'){
    const lists = fd.getAll('lists');
    const allVessels = fd.get('allVessels') === '1';
    const vesselIds = allVessels ? [] : fd.getAll('vesselIds');
    if(lists.length === 0){ alert('Choose at least one list to import.'); return; }
    if(!allVessels && vesselIds.length === 0){ alert('Choose at least one vessel, or tick "All vessels".'); return; }
    const emailTo = String(fd.get('emailTo')||'').trim();
    const meta = {
      daily:{ name:'Daily checklist', frequency:'daily', description:"OCEANHUB daily routine. The Williams Turbojet section covers the tender's start-of-day and pre-use checks; Engine Room & Systems includes the Cummins Onan generator's daily checks and mandatory CO detector test." },
      weekly:{ name:'Weekly checklist', frequency:'weekly', description:'General yacht best-practice weekly checks.' },
      monthly:{ name:'Monthly checklist', frequency:'monthly', description:'General yacht best-practice monthly checks.' },
      stock:{ name:'Stock guide', frequency:fd.get('stockFrequency') || 'weekly', description:'Exterior maintenance locker. Count what is on hand; par is what should be there.' }
    };
    /* skip any list a chosen vessel already has, so importing twice can't duplicate it */
    const overlaps = cl => allVessels || cl.allVessels || (cl.vesselIds||[]).some(id => vesselIds.includes(id));
    const alreadyHas = k => state.allChecklists.some(cl => cl.name === meta[k].name && overlaps(cl));
    const skipped = lists.filter(alreadyHas);
    const toImport = lists.filter(k => !alreadyHas(k));
    if(toImport.length === 0){ alert('Those vessels already have these lists, so nothing was imported.'); return; }
    if(skipped.length) alert(`Skipped ${skipped.map(k=>meta[k].name).join(', ')} — already set up for the chosen vessel(s).`);
    const created = toImport.map(k=>({ id:uid('cl'), createdDate:localISODate(new Date()), ...meta[k], emailTo, allVessels, vesselIds, items: standardChecklistItems(k) }));
    targetKey = 'checklists';
    mutateFn = fresh => [...fresh, ...created.filter(c => !fresh.some(x => x.name === c.name && (c.allVessels || x.allVessels || (x.vesselIds||[]).some(id => c.vesselIds.includes(id)))))];
  }

  if(targetKey && mutateFn){
    await persistArray(targetKey, mutateFn);
  }
  state.modal = nextModal;
  render();
}

/* ============================= GLOBAL ACTIONS ============================= */
function attachContentEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    const action = el.dataset.action;
    if(['close-modal','overlay-close','edit-vessel','delete-vessel'].includes(action)) return;
    el.addEventListener('click', async ()=>{
      const id = el.dataset.id;
      switch(action){
        case 'add-vessel': state.modal = { type:'vessel', data:null }; renderModal(); break;
        case 'view-vessel': state.modal = { type:'view-vessel', id }; renderModal(); break;
        case 'add-maintenance': state.modal = { type:'maintenance', data:null }; renderModal(); break;
        case 'edit-maintenance': state.modal = { type:'maintenance', data: state.maintenance.find(m=>m.id===id) }; renderModal(); break;
        case 'delete-maintenance':
          if(confirm('Delete this maintenance task?')){
            await persistArray('maintenance', fresh => fresh.filter(m=>m.id!==id));
            render();
          }
          break;
        case 'complete-task':
          await persistArray('maintenance', fresh => fresh.map(m=> m.id===id ? { ...m, status:'completed', completedDate:new Date().toISOString().slice(0,10) } : m));
          render();
          break;
        case 'edit-tender-task':
          { const v = state.vessels.find(x=>x.id===id); const t = v ? (v.tenders||[]).find(tt=>tt.id===el.dataset.tenderId) : null; const task = t ? (t.maintenance||[]).find(m=>m.id===el.dataset.taskId) : null;
            state.modal = { type:'tender-task', vesselId:id, tenderId:el.dataset.tenderId, data:task }; renderModal(); }
          break;
        case 'complete-tender-task':
          { const vesselId = id, tenderId = el.dataset.tenderId, taskId = el.dataset.taskId;
            await persistArray('vessels', fresh => fresh.map(v=>{
              if(v.id!==vesselId) return v;
              const tenders = (v.tenders||[]).map(t=>{
                if(t.id!==tenderId) return t;
                const tasks = (t.maintenance||[]).map(m=> m.id===taskId ? { ...m, status:'completed', completedDate:new Date().toISOString().slice(0,10) } : m);
                return { ...t, maintenance: tasks };
              });
              return { ...v, tenders };
            }));
            render(); }
          break;
        case 'delete-tender-task':
          if(confirm('Delete this maintenance task?')){
            const vesselId = id, tenderId = el.dataset.tenderId, taskId = el.dataset.taskId;
            await persistArray('vessels', fresh => fresh.map(v=>{
              if(v.id!==vesselId) return v;
              const tenders = (v.tenders||[]).map(t=> t.id===tenderId ? { ...t, maintenance:(t.maintenance||[]).filter(m=>m.id!==taskId) } : t);
              return { ...v, tenders };
            }));
            render();
          }
          break;
        case 'add-crew': state.modal = { type:'crew', data:null }; renderModal(); break;
        case 'edit-crew': state.modal = { type:'crew', data: state.crew.find(c=>c.id===id) }; renderModal(); break;
        case 'delete-crew':
          if(confirm('Remove this crew member?')){
            removeDocFiles((state.allCrew.find(c=>c.id===id) || {}).documents);
            await persistArray('crew', fresh => fresh.filter(c=>c.id!==id));
            render();
          }
          break;
        case 'add-qual': state.modal = { type:'qual', id, data:null }; renderModal(); break;
        case 'edit-qual':
          { const c = state.crew.find(x=>x.id===id); const q = c ? c.quals.find(qq=>qq.id===el.dataset.qualId) : null; state.modal = { type:'qual', id, data:q }; renderModal(); }
          break;
        case 'delete-qual':
          if(confirm('Remove this qualification?')){
            const qualId = el.dataset.qualId;
            await persistArray('crew', fresh => fresh.map(c=> c.id===id ? { ...c, quals:(c.quals||[]).filter(qq=>qq.id!==qualId) } : c));
            render();
          }
          break;
        case 'add-crew-doc': state.modal = { type:'crew-doc', id }; renderModal(); break;
        case 'delete-crew-doc':
          if(confirm('Remove this document? This cannot be undone.')){
            const docId = el.dataset.docId;
            removeDocFiles([{ id:docId }]);
            await persistArray('crew', fresh => fresh.map(c=> c.id===id ? { ...c, documents:(c.documents||[]).filter(d=>d.id!==docId) } : c));
            render();
          }
          break;
        case 'add-company': state.modal = { type:'company', data:null }; renderModal(); break;
        case 'edit-company': state.modal = { type:'company', data: state.companies.find(c=>c.id===id) }; renderModal(); break;
        case 'delete-company':
          if(confirm('Delete this company and its owner login? The vessels and their records are kept.')){
            const co = state.companies.find(c=>c.id===id);
            if(co && co.loginUid){ try{ await firebase.database().ref('oceanhub/users/' + co.loginUid).remove(); }catch(e){} }
            await persistArray('companies', fresh => fresh.filter(c=>c.id!==id));
            render();
          }
          break;
        case 'reveal-password': {
          const span = el.previousElementSibling;
          if(span && span.classList.contains('pw-mask')){
            const shown = span.dataset.shown === '1';
            span.textContent = shown ? '••••••••' : (span.dataset.pw || '');
            span.dataset.shown = shown ? '0' : '1';
            el.textContent = shown ? 'Show' : 'Hide';
          }
          break;
        }
        case 'add-checklist': state.modal = { type:'checklist', data:null }; renderModal(); break;
        case 'import-checklists': state.modal = { type:'checklist-import' }; renderModal(); break;
        case 'edit-checklist': state.modal = { type:'checklist', data: state.allChecklists.find(c=>c.id===id) }; renderModal(); break;
        case 'delete-checklist':
          if(confirm('Delete this checklist? Past submissions and stock counts are kept.')){
            await persistArray('checklists', fresh => fresh.filter(c=>c.id!==id));
            render();
          }
          break;
        case 'cl-pick':
          if(el.dataset.checklistId !== state.clView.checklistId && confirmDiscardChecklist()){
            state.clView.checklistId = el.dataset.checklistId; state.clView.period = null; state.clSaved = false; render();
          }
          break;
        case 'cl-open':
          if(confirmDiscardChecklist()){ state.clView.period = el.dataset.period; state.clSaved = false; render(); }
          break;
        case 'cl-current':
          if(confirmDiscardChecklist()){ state.clView.period = null; state.clSaved = false; render(); }
          break;
        case 'print-checklist':
          document.body.classList.add('print-checklist');
          window.addEventListener('afterprint', ()=> document.body.classList.remove('print-checklist'), { once:true });
          window.print();
          break;
        case 'maint-view': state.maintView = el.dataset.view; render(); break;
        case 'fin-generate': generateCostReport(); break;
        case 'fin-view': captureFinControls(); state.fin.view = el.dataset.view; render(); break;
        case 'add-fin-item': state.modal = { type:'finance-item', data:null }; renderModal(); break;
        case 'scan-invoice': state.modal = { type:'invoice-scan', step:'pick', files:[] }; renderModal(); break;
        case 'open-invoice-file': await openFileById(el.dataset.file); break;
        case 'edit-fin-item': state.modal = { type:'finance-item', data: state.financeItems.find(x=>x.id===id) }; renderModal(); break;
        case 'delete-fin-item': {
          const x = state.financeItems.find(i=>i.id===id);
          if(x && confirm(`Delete this cost — ${x.description} (${fmtCurrency(x.cost)})?`)){
            const fresh = await persistArray('financeItems', fresh => fresh.filter(i=>i.id!==id));
            /* the invoice copy goes once no other cost from that invoice still uses it */
            if(fresh){
              const stillUsed = new Set(fresh.flatMap(i=>(i.invoiceFiles||[]).map(f=>f.id)));
              await removeDocFiles((x.invoiceFiles||[]).filter(f=>!stillUsed.has(f.id)));
            }
            render();
          }
          break;
        }
        case 'fin-pdf': case 'fin-csv': case 'fin-email': await finFileAction(action, el.dataset.kind); break;
        case 'svc-unit': state.svcMeterId = el.dataset.meter; render(); break;
        case 'svc-complete': await completeServiceTask(el.dataset.task); break;
        case 'svc-undo':
          if(confirm('Remove the last completion of this task? It will count from the completion before it.')){
            await persistArray('serviceLog', fresh => fresh.filter(s=>s.id!==id));
            render();
          }
          break;
        case 'delete-hour-reading':
          if(confirm('Delete this reading? It removes every meter logged at the same time. Current hours on the vessel are not changed.')){
            await persistArray('hourReadings', fresh => fresh.filter(r=>r.id!==id));
            render();
          }
          break;
        case 'delete-checklist-run':
          if(confirm('Delete this checklist submission?')){
            await persistArray('checklistRuns', fresh => fresh.filter(r=>r.id!==id));
            render();
          }
          break;
        case 'view-doc':
          openDocument(el.dataset);
          break;
        case 'logout':
          if(confirm('Sign out? You will need to sign in again to get back in.')){ await logout(); }
          break;
      }
    });
  });

  const fv = document.getElementById('filterVessel');
  const fc = document.getElementById('filterCategory');
  const fs = document.getElementById('filterStatus');
  const fm = document.getElementById('filterMeter');
  if(fv) fv.addEventListener('change', ()=>{ state.filters.vessel=fv.value; state.filters.meter='all'; render(); });
  if(fm) fm.addEventListener('change', ()=>{ state.filters.meter=fm.value; render(); });
  /* Equipment column: set a task's engine / equipment straight from the list */
  document.querySelectorAll('select.row-meter').forEach(sel=> sel.addEventListener('change', async ()=>{
    const task = state.maintenance.find(m=>m.id===sel.dataset.id);
    if(!task) return;
    const meterId = sel.value;
    const meterLabel = meterId ? (maintMeterLabel(task.vesselId, meterId) || task.meterLabel || '') : '';
    await persistArray('maintenance', fresh => fresh.map(m=> m.id===task.id
      ? { ...m, meterId, meterLabel, dueHours: meterId === m.meterId ? (m.dueHours ?? null) : null } : m));
    render();
  }));
  if(fc) fc.addEventListener('change', ()=>{ state.filters.category=fc.value; render(); });
  if(fs) fs.addEventListener('change', ()=>{ state.filters.status=fs.value; render(); });
  attachChecklistPageEvents();
  attachHoursPageEvents();
  attachServicePageEvents();
  attachFinancePageEvents();
}

/* ============================= RENDER DISPATCH ============================= */
function render(){
  if(!session){ renderLoginGate(); return; }
  if(session.role === 'owner' && !currentCompany()){
    /* the company/login was removed or reassigned while signed in */
    session = null;
    authNotice = 'Your access has changed — please ask the OCEANHUB admin.';
    firebase.auth().signOut();
    return;
  }
  applyScoping();
  renderHeaderMeta();
  renderNav();
  const allowed = navTabs().map(t=>t.id);
  if(!allowed.includes(state.activeTab)) state.activeTab = 'dashboard';
  const main = document.getElementById('mainContent');
  switch(state.activeTab){
    case 'dashboard': main.innerHTML = renderDashboard(); break;
    case 'vessels': main.innerHTML = renderVessels(); break;
    case 'maintenance': main.innerHTML = renderMaintenance(); break;
    case 'crew': main.innerHTML = renderCrew(); break;
    case 'companies': main.innerHTML = renderCompanies(); break;
    case 'checklists': main.innerHTML = renderChecklists(); break;
    case 'hours': main.innerHTML = renderHours(); break;
    case 'finance': main.innerHTML = renderFinance(); break;
  }
  attachContentEvents();
  renderModal();
}

/* ============================= DAY / NIGHT SWITCH ============================= */
function renderThemeToggle(){
  const btn = document.getElementById('themeToggle');
  const dark = document.documentElement.dataset.theme === 'dark';
  /* shows the mode you'll switch to */
  btn.innerHTML = dark
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="tt-label">Day</span>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="tt-label">Night</span>';
  btn.title = btn.ariaLabel = dark ? 'Switch to day mode' : 'Switch to night mode';
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  const dark = document.documentElement.dataset.theme !== 'dark';
  if(dark) document.documentElement.dataset.theme = 'dark';
  else delete document.documentElement.dataset.theme;
  try{ localStorage.setItem('oceanhub_theme', dark ? 'dark' : 'light'); }catch(e){}
  renderThemeToggle();
});
renderThemeToggle();
wireDateFields();

bootstrap();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker registration failed', err));
  });
}
</script>
